<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>المفلس الحقيقي</title>
<style>
@font-face{font-family:'Amiri';src:url(fonts/Amiri-Bold.ttf) format('truetype');font-weight:700}
@font-face{font-family:'ReemKufi';src:url(fonts/ReemKufi-Bold.ttf) format('truetype');font-weight:700}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block;width:100vw;height:100vh;object-fit:contain;background:#000}
#ui{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:12px;align-items:center;background:rgba(10,8,4,.6);border:1px solid rgba(232,190,110,.35);padding:8px 16px;border-radius:40px;color:#f3d79a;font-family:sans-serif}
#ui button{background:none;border:1px solid rgba(232,190,110,.5);color:#f3d79a;border-radius:20px;padding:6px 16px;cursor:pointer}
#ui input{width:min(50vw,420px);accent-color:#d9a94e}
body.render #ui{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"><button id="play">▶</button><input id="seek" type="range" min="0" max="90" step="0.01" value="0"><span id="tm">0:00</span></div>
<audio id="aud" src="soundtrack.wav" preload="auto"></audio>
<script src="rig.js"></script>
<script>
/* «المفلس الحقيقي» — حديث صحيح مسلم (2581)، فيديو توعوي عمودي بشخصيات بلا ملامح وجه وكابشن بالفصحى. */
const W = 1080, H = 1920, FPS = 30, DUR = 90;
const cv = document.getElementById('c'); cv.width = W; cv.height = H; const ctx = cv.getContext('2d');
const mk = (w = W, h = H) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const buf = mk(), bctx = buf.getContext('2d');
const pulse = (t, c, w) => Math.exp(-Math.pow((t - c) / w, 2));
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(777);
function sprite(r, g, b, size = 128) { const c = mk(size, size), x = c.getContext('2d'); const gr = x.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.15, `rgba(${r},${g},${b},.85)`); gr.addColorStop(.45, `rgba(${r},${g},${b},.25)`); gr.addColorStop(1, `rgba(${r},${g},${b},0)`); x.fillStyle = gr; x.fillRect(0, 0, size, size); return c; }
const SP = { gold: sprite(255, 196, 90), warm: sprite(255, 150, 70), red: sprite(255, 70, 40), white: sprite(230, 240, 255), violet: sprite(150, 90, 255) };
function glow(c, sp, x, y, s, a = 1) { if (a <= .003) return; c.save(); c.globalCompositeOperation = 'lighter'; c.globalAlpha = a; c.drawImage(sp, x - s / 2, y - s / 2, s, s); c.restore(); }
function vgrad(c, y0, y1, stops) { const g = c.createLinearGradient(0, y0, 0, y1); stops.forEach(([o, col]) => g.addColorStop(o, col)); return g; }
function star8(c, cx, cy, Rr, rot) { const ri = Rr * Math.cos(Math.PI / 4) / Math.cos(Math.PI / 8); c.beginPath(); for (let i = 0; i < 16; i++) { const r = i % 2 ? ri : Rr, an = rot + i * Math.PI / 8; c.lineTo(cx + r * Math.cos(an), cy + r * Math.sin(an)); } c.closePath(); }
function mixP(a, b, k) { const o = {}; for (const key of new Set([...Object.keys(a), ...Object.keys(b)])) { const va = a[key], vb = b[key]; if (Array.isArray(va) && Array.isArray(vb)) o[key] = [lerp(va[0], vb[0], k), lerp(va[1], vb[1], k)]; else if (typeof va === 'number' && typeof vb === 'number') o[key] = lerp(va, vb, k); else o[key] = k < .5 ? (va ?? vb) : (vb ?? va); } return o; }
function seq(st, t, list) { let i = 0; while (i + 1 < list.length && t >= list[i + 1][0]) i++; const cur = Object.assign(basePose(st), list[i][1](t - list[i][0])); if (i > 0) { const k = eInOut((t - list[i][0]) / .45); if (k < 1) return mixP(Object.assign(basePose(st), list[i - 1][1](t - list[i - 1][0])), cur, k); } return cur; }

/* ---------------- cast (faceless) ---------------- */
STYLES.muflis = { P: ADULT, skin: '#c8946a', shirt: '#8d9097', robe: true, sleeve: 'long', pants: '#6a6d74', shoe: '#3a2a20', hair: '#1e1612', cap: '#f4f1ea' };
STYLES.elder = { P: ADULT, skin: '#d2a07a', shirt: '#7a5a3a', robe: true, sleeve: 'long', pants: '#5a4430', shoe: '#2a1d14', hair: '#e9e6e0' };
STYLES.youth = { P: ADULT, skin: '#e0b48e', shirt: '#3f73b8', sleeve: 'short', pants: '#2f3440', shoe: '#e8e8e8', hair: '#3a2416' };
STYLES.merchant = { P: ADULT, skin: '#b9825a', shirt: '#2f7a72', sleeve: 'long', pants: '#3e3a36', shoe: '#2a1d14', hair: '#231914', apron: '#e9dcc0', belly: .1 };
STYLES.porter = { P: ADULT, skin: '#9c6a46', shirt: '#b5562e', sleeve: 'short', pants: '#4a4036', shoe: '#5b3b22', hair: '#1a120e' };
STYLES.poor = { P: ADULT, skin: '#c08a62', shirt: '#7d7a6e', sleeve: 'short', pants: '#5a564c', shoe: '#4a3a2a', hair: '#4a3a2a', patches: true };
STYLES.wounded = { P: ADULT, skin: '#d9a982', shirt: '#6b4f8a', sleeve: 'long', pants: '#3a3446', shoe: '#2a2a2a', hair: '#2a1d16' };
const MF = STYLES.muflis, EL = STYLES.elder, YO = STYLES.youth, ME = STYLES.merchant, PO = STYLES.porter, PR = STYLES.poor, WD = STYLES.wounded;
const GY = H * .64, S = 220;
const headY = (gy, s, st) => gy - s * ((st.P.thigh + st.P.shin) * .985 + st.P.T + st.P.neck + st.P.headR * 1.9);
const ELDER = (t, extra) => Object.assign({ lean: .1, nod: .5, hipH: (EL.P.thigh + EL.P.shin) * .95, handR: [EL.P.sw + .25, -EL.P.T + .95], elbowR: -1, propR: PROPS.cane, bob: Math.sin(t * 1.8) * .008 }, extra || {});
const PORTER = (t, extra) => Object.assign({ handR: [PO.P.sw - .05, -PO.P.T - .02], elbowR: -1, propR: PROPS.sack, head: .08 }, extra || {});
const POINT = (st, k = 1) => ({ handR: [lerp(st.P.sw + .1, st.P.sw + .8, k), lerp(-st.P.T + .95, -st.P.T + .15, k)], elbowR: 1, lean: -.05 * k, head: -.05 });
const PUSH = (st, k) => ({ handL: [lerp(-st.P.sw, st.P.sw + .55, k), -st.P.T + .4], handR: [lerp(st.P.sw, st.P.sw + .75, k), -st.P.T + .36], elbowL: 1, elbowR: 1, lean: .16 * k });
const QIYAM = st => ({ handL: [.06, -st.P.T + .42], handR: [-.02, -st.P.T + .38], elbowL: 1, elbowR: -1, nod: .5 });
const DEFEND = (st, k) => ({ handL: [lerp(-st.P.sw - .1, -.05, k), lerp(-st.P.T + .9, -st.P.T - .2, k)], handR: [lerp(st.P.sw + .1, .28, k), lerp(-st.P.T + .9, -st.P.T - .28, k)], elbowL: 1, elbowR: -1, lean: -.14 * k, head: -.12 * k, hipX: -.05 * k });
function lying(c, x, gy, s, st, k) { // fallen on the ground, head to the right
  const e = eOut(k); c.save(); c.translate(x, gy - s * .24 * e); c.rotate(Math.PI / 2 * e);
  const p = Object.assign(basePose(st), { handL: [-st.P.sw * .55, -st.P.T + .98], handR: [st.P.sw * .2, -st.P.T + .62], elbowL: 1, elbowR: -1, head: .12, footL: [-.06, (st.P.thigh + st.P.shin) * .985], footR: [.06, (st.P.thigh + st.P.shin) * .985], kneeL: 1 });
  drawChar(c, 0, 0, s, st, p); c.restore(); }
function sling(c, x, gy, s, st, face) { // bandaged forearm held across the chest, strap around the neck
  const hip = gy - s * (st.P.thigh + st.P.shin) * .985, hx = x + face * s * .06, hy = hip - s * (st.P.T - .45), nx = x, ny = hip - s * (st.P.T + .02);
  c.save(); c.strokeStyle = '#f4f2ec'; c.lineCap = 'round'; c.lineWidth = s * .045;
  c.beginPath(); c.moveTo(nx - face * s * .1, ny); c.lineTo(hx - face * s * .05, hy); c.moveTo(nx + face * s * .1, ny); c.lineTo(hx - face * s * .3, hy); c.stroke();
  c.fillStyle = '#f4f2ec'; c.beginPath(); c.roundRect(Math.min(hx, hx - face * s * .38) , hy - s * .1, s * .38, s * .2, s * .08); c.fill();
  c.strokeStyle = 'rgba(0,0,0,.15)'; c.lineWidth = 2; c.stroke(); for (let i = 1; i < 4; i++) { const xx = hx - face * s * .095 * i; c.beginPath(); c.moveTo(xx, hy - s * .09); c.lineTo(xx, hy + s * .09); c.stroke(); }
  c.restore(); }
const SITX = st => { const h = .3; return { hipH: h, footL: [-.42, h], footR: [.42, h], kneeL: -1, kneeR: 1, handL: [-.3, -.05], handR: [.42, -st.P.T + .55], elbowL: 1, elbowR: -1 }; };

/* hasanat = 12 orbs (4 victims × 3) */
const NORB = 15;
function orbPos(i, x, hy) { const an = Math.PI + (i + .5) / NORB * Math.PI; return [x + Math.cos(an) * 230, hy - 40 + Math.sin(an) * 170]; }
function orb(c, x, y, s, a = 1) { glow(c, SP.gold, x, y, s * 5, .55 * a); c.save(); c.globalAlpha = a; c.fillStyle = '#fff3c8'; c.beginPath(); c.arc(x, y, s * .45, 0, TAU); c.fill(); c.restore(); }
function sinStone(c, x, y, s, a = 1) { c.save(); c.globalAlpha = a; c.fillStyle = '#1a1416'; c.beginPath(); c.moveTo(x - s, y); c.quadraticCurveTo(x - s * .9, y - s * .9, x, y - s * .8); c.quadraticCurveTo(x + s * 1.1, y - s * .7, x + s, y); c.quadraticCurveTo(x, y + s * .5, x - s, y); c.fill(); c.strokeStyle = 'rgba(255,60,40,.6)'; c.lineWidth = 3; c.stroke(); c.restore(); glow(c, SP.red, x, y, s * 3, .25 * a); }
/* the "grievance" mark that stays above a wronged person */
function mark(c, x, y, a, t) { if (a <= 0) return; c.save(); c.globalAlpha = a; c.translate(x, y); const s = 1 + .06 * Math.sin(t * 4); c.scale(s, s);
  glow(c, SP.red, 0, 0, 160, .5 * a); c.fillStyle = '#c0392b'; c.beginPath(); c.arc(0, 0, 26, 0, TAU); c.fill(); c.strokeStyle = '#ffd2c8'; c.lineWidth = 6; c.lineCap = 'round';
  c.beginPath(); c.moveTo(-6, -14); c.lineTo(4, -2); c.lineTo(-4, 4); c.lineTo(6, 14); c.stroke(); c.restore(); }
function wallet(c, x, y, s, open, tilt) { c.save(); c.translate(x, y); c.rotate(tilt); c.scale(s, s);
  c.fillStyle = '#6b4226'; c.beginPath(); c.roundRect(-1.2, -.7, 2.4, 1.4, .15); c.fill(); c.strokeStyle = '#3e2414'; c.lineWidth = .06; c.stroke();
  c.save(); c.rotate(-open * 1.2); c.fillStyle = '#7d4e2e'; c.beginPath(); c.roundRect(-1.2, -.7, 2.4, .6, .12); c.fill(); c.restore();
  c.setLineDash([.08, .08]); c.strokeStyle = 'rgba(255,220,170,.4)'; c.lineWidth = .03; c.strokeRect(-1.08, -.58, 2.16, 1.16); c.setLineDash([]); c.restore(); }
function burst(c, x, y, s, t, a) { c.save(); c.globalAlpha = a; c.translate(x, y); c.rotate(Math.sin(t * 20) * .05); c.fillStyle = '#d9473a'; c.beginPath();
  for (let i = 0; i < 18; i++) { const r = i % 2 ? s * .6 : s, an = i / 18 * TAU; c.lineTo(Math.cos(an) * r * 1.3, Math.sin(an) * r); } c.fill();
  c.strokeStyle = '#1a0a0a'; c.lineWidth = 6; c.beginPath(); for (let i = 0; i < 6; i++) c.lineTo(-s * .7 + i * s * .28, (i % 2 ? -1 : 1) * s * .25); c.stroke(); c.restore(); }
function cloud(c, x, y, s, a) { c.save(); c.globalAlpha = a; c.fillStyle = '#2a2a33'; [[-.5, 0, .5], [0, -.2, .6], [.5, 0, .5], [0, .15, .55]].forEach(([dx, dy, r]) => { c.beginPath(); c.arc(x + dx * s, y + dy * s, r * s, 0, TAU); c.fill(); }); c.restore(); }
function whisper(c, x, y, a, t) { c.save(); c.globalAlpha = a; c.strokeStyle = 'rgba(40,40,50,.85)'; c.lineWidth = 5; for (let i = 0; i < 3; i++) { c.beginPath(); c.arc(x, y, 20 + i * 18 + (t * 30 % 18), -.6, .6); c.stroke(); } c.restore(); }
function book(c, x, y, s) { c.save(); c.translate(x, y); c.scale(s, s);
  c.fillStyle = '#6b2a2a'; c.beginPath(); c.moveTo(-2.1, .1); c.lineTo(0, .3); c.lineTo(2.1, .1); c.lineTo(2.1, .3); c.lineTo(0, .5); c.lineTo(-2.1, .3); c.fill();
  c.fillStyle = '#f5ecd6'; c.beginPath(); c.moveTo(0, .3); c.quadraticCurveTo(-1, -.05, -2, .05); c.lineTo(-2, -1.3); c.quadraticCurveTo(-1, -1.45, 0, -1.1); c.fill();
  c.beginPath(); c.moveTo(0, .3); c.quadraticCurveTo(1, -.05, 2, .05); c.lineTo(2, -1.3); c.quadraticCurveTo(1, -1.45, 0, -1.1); c.fill();
  c.fillStyle = 'rgba(60,40,20,.35)'; for (let i = 0; i < 9; i++) { c.fillRect(-1.8, -1.1 + i * .12, 1.5 - (i % 3) * .2, .035); c.fillRect(.3, -1.1 + i * .12, 1.5 - (i % 2) * .25, .035); }
  c.strokeStyle = '#d6a94f'; c.lineWidth = .03; star8(c, -1.05, -1.25, .08, 0); c.stroke(); star8(c, 1.05, -1.25, .08, 0); c.stroke(); c.restore(); }
function pattern(c, t, a, col = '#e8be6e') { c.save(); c.globalAlpha = a; c.strokeStyle = col; c.lineWidth = 1.5; for (let gx = -1; gx <= 7; gx++) for (let gy = -1; gy <= 12; gy++) { star8(c, gx * 180, gy * 180, 70, t * .04); c.stroke(); } c.restore(); }
const STARS = Array.from({ length: 260 }, () => [R() * W, R() * H * .7, R() * 2 + .5, R() * TAU]);
function stars(c, t, a) { c.fillStyle = '#fff'; for (const [x, y, r, p] of STARS) { c.globalAlpha = a * (.3 + .4 * Math.sin(t * 2 + p)); c.fillRect(x, y, r, r); } c.globalAlpha = 1; }
function arch(c, x, y, w, h) { c.beginPath(); c.moveTo(x - w / 2, y); c.lineTo(x - w / 2, y - h * .62); c.quadraticCurveTo(x - w / 2, y - h, x, y - h * 1.08); c.quadraticCurveTo(x + w / 2, y - h, x + w / 2, y - h * .62); c.lineTo(x + w / 2, y); c.closePath(); }
function lantern(c, x, y, t, a = 1) { c.strokeStyle = '#2a1d14'; c.lineWidth = 3; c.beginPath(); c.moveTo(x, y - 120); c.lineTo(x, y - 40); c.stroke(); c.fillStyle = '#c9a046'; c.beginPath(); c.moveTo(x - 26, y - 40); c.lineTo(x + 26, y - 40); c.lineTo(x + 20, y + 30); c.lineTo(x - 20, y + 30); c.fill(); c.fillStyle = '#ffe2a0'; c.fillRect(x - 14, y - 30, 28, 50); glow(c, SP.warm, x, y, 360, .45 * a * (.9 + .1 * Math.sin(t * 9 + x))); }

/* ---------------- environments ---------------- */
function mosqueBG(c, t) {
  c.fillStyle = vgrad(c, 0, H, [[0, '#1b2a3a'], [1, '#0d141c']]); c.fillRect(0, 0, W, H);
  c.fillStyle = '#e9e0cc'; c.fillRect(0, 0, W, GY - 40);
  for (let i = -1; i < 5; i++) { c.fillStyle = 'rgba(160,140,110,.35)'; arch(c, i * 300 + 150, GY - 40, 220, 760); c.fill(); }
  c.fillStyle = '#1e5a4a'; arch(c, W / 2, GY - 40, 300, 760); c.fill(); c.strokeStyle = '#d4a94f'; c.lineWidth = 10; c.stroke();
  glow(c, SP.gold, W / 2, GY - 400, 700, .45); c.strokeStyle = 'rgba(212,169,79,.8)'; c.lineWidth = 4; star8(c, W / 2, GY - 520, 60, t * .1); c.stroke();
  c.fillStyle = '#7a1f2a'; c.fillRect(0, GY - 40, W, H); c.strokeStyle = 'rgba(212,169,79,.5)'; c.lineWidth = 4; for (let i = 0; i < 6; i++) { c.beginPath(); c.moveTo(0, GY + 40 + i * 110); c.lineTo(W, GY + 40 + i * 110); c.stroke(); }
  for (let i = 0; i < 3; i++) lantern(c, W * (.2 + i * .3), H * .12, t);
}
function iftarBG(c, t) {
  c.fillStyle = vgrad(c, 0, GY, [[0, '#2a2350'], [.55, '#e3735a'], [1, '#ffc46e']]); c.fillRect(0, 0, W, H);
  glow(c, SP.gold, W * .75, GY - 220, 900, .55); c.fillStyle = '#ffe0a0'; c.beginPath(); c.arc(W * .75, GY - 220 + t * 14, 90, 0, TAU); c.fill();
  const ma = ss(1.5, 3, t); c.save(); c.globalAlpha = ma; c.fillStyle = '#fff6dc'; c.beginPath(); c.arc(W * .22, H * .12, 46, .5, TAU - .5); c.arc(W * .22 + 16, H * .12 - 6, 38, TAU - .65, .65, true); c.fill(); c.restore();
  c.fillStyle = 'rgba(60,30,40,.6)'; for (let i = 0; i < 7; i++) { const bx = i * 160 - 20, bh = 220 + (i * 71 % 200); c.fillRect(bx, GY - 60 - bh, 140, bh + 60); }
  c.fillStyle = 'rgba(60,30,40,.7)'; c.beginPath(); c.arc(W * .5, GY - 360, 110, Math.PI, 0); c.fill(); c.fillRect(W * .5 - 110, GY - 360, 220, 300); c.fillRect(W * .84, GY - 620, 50, 560); c.beginPath(); c.arc(W * .84 + 25, GY - 620, 32, Math.PI, 0); c.fill();
  c.fillStyle = vgrad(c, GY - 10, H, [[0, '#8a5a3a'], [1, '#3a2418']]); c.fillRect(0, GY - 10, W, H);
}
function streetBG(c, t) {
  c.fillStyle = vgrad(c, 0, GY, [[0, '#7fb6dc'], [1, '#f2e2c0']]); c.fillRect(0, 0, W, H);
  const house = (x, w, h, col) => { c.fillStyle = col; c.fillRect(x, GY - h, w, h); c.fillStyle = 'rgba(0,0,0,.12)'; c.fillRect(x, GY - h, w, 16);
    c.fillStyle = '#5a3a26'; arch(c, x + w / 2, GY, w * .32, h * .45); c.fill();
    c.fillStyle = '#6b4a30'; c.fillRect(x + w * .14, GY - h * .8, w * .3, h * .2); c.strokeStyle = '#3a2416'; c.lineWidth = 3; for (let i = 1; i < 4; i++) { c.beginPath(); c.moveTo(x + w * .14 + i * w * .075, GY - h * .8); c.lineTo(x + w * .14 + i * w * .075, GY - h * .6); c.stroke(); } };
  house(-40, 330, 760, '#e3c9a0'); house(290, 300, 620, '#d9b88a'); house(590, 320, 820, '#e8d2ae'); house(910, 260, 680, '#d4ae80');
  c.fillStyle = vgrad(c, GY - 10, H, [[0, '#c9a77a'], [1, '#6b5034']]); c.fillRect(0, GY - 10, W, H);
  c.strokeStyle = 'rgba(0,0,0,.08)'; c.lineWidth = 3; for (let i = 0; i < 10; i++) { c.beginPath(); c.moveTo(0, GY + 30 + i * 70); c.lineTo(W, GY + 30 + i * 70); c.stroke(); }
}
function stall(c, x, t) { // merchant's stall
  c.fillStyle = '#6b4226'; c.fillRect(x - 220, GY - 260, 440, 30); c.fillRect(x - 210, GY - 230, 20, 230); c.fillRect(x + 190, GY - 230, 20, 230);
  for (let i = 0; i < 8; i++) { c.fillStyle = i % 2 ? '#f4efe4' : '#c0392b'; c.beginPath(); c.moveTo(x - 240 + i * 60, GY - 560); c.lineTo(x - 180 + i * 60, GY - 560); c.lineTo(x - 180 + i * 60, GY - 500); c.quadraticCurveTo(x - 210 + i * 60, GY - 470, x - 240 + i * 60, GY - 500); c.fill(); }
  c.fillStyle = '#4a2e1c'; c.fillRect(x - 225, GY - 560, 10, 300); c.fillRect(x + 215, GY - 560, 10, 300);
  const fr = [['#e67e22', 5], ['#c0392b', 4], ['#7cb342', 5]]; fr.forEach(([col, n], j) => { for (let k = 0; k < n; k++) { c.fillStyle = col; c.beginPath(); c.arc(x - 170 + j * 140 + k * 22, GY - 282 - (k % 2) * 16, 20, 0, TAU); c.fill(); } });
}

/* ============================ SCENES ============================ */
// 1 · 0–8 «أتدرون ما المفلس؟» — the empty wallet
function sc1(c, lt) {
  c.fillStyle = vgrad(c, 0, H, [[0, '#1b1426'], [1, '#0a0810']]); c.fillRect(0, 0, W, H); pattern(c, lt, .06); glow(c, SP.gold, W / 2, H * .36, 900, .25);
