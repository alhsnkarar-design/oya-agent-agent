<style>

<body>
<canvas id="c"></canvas>
<div id="ui"><button id="play">▶</button><input id="seek" type="range" min="0" max="91" step="0.01" value="0"><span id="tm">0:00</span></div>
<audio id="aud" src="soundtrack.wav" preload="auto"></audio>
<script src="rig.js"></script>
<script>
/* «الثلاثة أول من يُقضى عليهم يوم القيامة» — صحيح مسلم 1905، شخصيات بلا ملامح وجه، كابشن بالفصحى. */
const W = 1080, H = 1920, FPS = 30, DUR = 91;
const cv = document.getElementById('c'); cv.width = W; cv.height = H; const ctx = cv.getContext('2d');
const mk = (w = W, h = H) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const buf = mk(), bctx = buf.getContext('2d');
const pulse = (t, c, w) => Math.exp(-Math.pow((t - c) / w, 2));
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(777);
function sprite(r, g, b, size = 128) { const c = mk(size, size), x = c.getContext('2d'); const gr = x.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.15, `rgba(${r},${g},${b},.85)`); gr.addColorStop(.45, `rgba(${r},${g},${b},.25)`); gr.addColorStop(1, `rgba(${r},${g},${b},0)`); x.fillStyle = gr; x.fillRect(0, 0, size, size); return c; }
const SP = { gold: sprite(255, 196, 90), warm: sprite(255, 150, 70), red: sprite(255, 70, 40), white: sprite(230, 240, 255), violet: sprite(150, 90, 255) };
function glow(c, sp, x, y, s, a = 1) { if (a <= .003) return; c.save(); c.globalCompositeOperation = 'lighter'; c.globalAlpha = a; c.drawImage(sp, x - s / 2, y - s / 2, s, s); c.restore(); }
function vgrad(c, y0, y1, stops) { const g = c.createLinearGradient(0, y0, 0, y1); stops.forEach(([o, col]) => g.addColorStop(o, col)); return g; }
function star8(c, cx, cy, Rr, rot) { const ri = Rr * Math.cos(Math.PI / 4) / Math.cos(Math.PI / 8); c.beginPath(); for (let i = 0; i < 16; i++) { const r = i % 2 ? ri : Rr, an = rot + i * Math.PI / 8; c.lineTo(cx + r * Math.cos(an), cy + r * Math.sin(an)); } c.closePath(); }
function mixP(a, b, k) { const o = {}; for (const key of new Set([...Object.keys(a), ...Object.keys(b)])) { const va = a[key], vb = b[key]; if (Array.isArray(va) && Array.isArray(vb)) o[key] = [lerp(va[0], vb[0], k), lerp(va[1], vb[1], k)]; else if (typeof va === 'number' && typeof vb === 'number') o[key] = lerp(va, vb, k); else o[key] = k < .5 ? (va ?? vb) : (vb ?? va); } return o; }
function seq(st, t, list) { let i = 0; while (i + 1 < list.length && t >= list[i + 1][0]) i++; const cur = Object.assign(basePose(st), list[i][1](t - list[i][0])); if (i > 0) { const k = eInOut((t - list[i][0]) / .45); if (k < 1) return mixP(Object.assign(basePose(st), list[i - 1][1](t - list[i - 1][0])), cur, k); } return cur; }

/* ---------------- cast (faceless) ---------------- */
STYLES.taker = { P: ADULT, skin: '#d2a07a', shirt: '#f3f3f1', sleeve: 'long', sleeveCol: '#5a4632', pants: '#4a3a2a', shoe: '#1a1410', jacket: '#5a4632', tie: '#2f7a4a', hair: '#1e1612', watch: true, belly: .05 };
STYLES.elder = { P: ADULT, skin: '#d2a07a', shirt: '#7a5a3a', robe: true, sleeve: 'long', pants: '#5a4430', shoe: '#2a1d14', hair: '#e9e6e0' };
STYLES.youth = { P: ADULT, skin: '#e0b48e', shirt: '#3f73b8', sleeve: 'short', pants: '#2f3440', shoe: '#e8e8e8', hair: '#3a2416' };
STYLES.merchant = { P: ADULT, skin: '#b9825a', shirt: '#2f7a72', sleeve: 'long', pants: '#3e3a36', shoe: '#2a1d14', hair: '#231914', apron: '#e9dcc0', belly: .1 };
STYLES.porter = { P: ADULT, skin: '#9c6a46', shirt: '#b5562e', sleeve: 'short', pants: '#4a4036', shoe: '#5b3b22', hair: '#1a120e' };
STYLES.judge = { P: ADULT, skin: '#c8946a', shirt: '#e8e2d2', robe: true, sleeve: 'long', pants: '#d8d0bc', shoe: '#3a2a20', hair: '#2a1d16', cap: '#ffffff' };
STYLES.pilgrim = { P: ADULT, skin: '#c8946a', shirt: '#f4f2ec', robe: true, sleeve: 'long', pants: '#f4f2ec', shoe: '#d9c3a6', hair: '#2a1d16' };
const TK = STYLES.taker, EL = STYLES.elder, YO = STYLES.youth, ME = STYLES.merchant, PO = STYLES.porter, JD = STYLES.judge, PG = STYLES.pilgrim;
const GY = H * .64, S = 220;
const headY = (gy, s, st) => gy - s * ((st.P.thigh + st.P.shin) * .985 + st.P.T + st.P.neck + st.P.headR * 1.9);
const ELDER = (t, extra) => Object.assign({ lean: .1, nod: .5, hipH: (EL.P.thigh + EL.P.shin) * .95, handR: [EL.P.sw + .25, -EL.P.T + .95], elbowR: -1, propR: PROPS.cane, bob: Math.sin(t * 1.8) * .008 }, extra || {});
const OATH = st => ({ handR: [st.P.sw + .05, -st.P.T - .62], elbowR: 1, head: -.06, lean: -.03 });
const WAITP = st => ({ handR: [st.P.sw + .32, -st.P.T - .02], elbowR: 1, head: -.08 });

/* ---------------- helpers ---------------- */
function coin(c, x, y, s, a = 1, rot = 0) { c.save(); c.globalAlpha = a; c.translate(x, y); c.scale(Math.max(.15, Math.abs(Math.cos(rot))), 1); c.fillStyle = '#e8c766'; c.beginPath(); c.arc(0, 0, s, 0, TAU); c.fill(); c.strokeStyle = '#a8862e'; c.lineWidth = s * .14; c.stroke(); c.fillStyle = 'rgba(255,255,255,.45)'; c.beginPath(); c.arc(-s * .3, -s * .3, s * .25, 0, TAU); c.fill(); c.restore(); }
function coinPile(c, x, y, n, s) { for (let i = 0; i < n; i++) { const r = Math.floor(Math.sqrt(i)), k = i - r * r; coin(c, x + (k - r) * s * 1.1 + (r % 2) * s * .5, y - r * s * .55, s); } }
function dust(c, x, y, k, n = 40) { for (let i = 0; i < n; i++) { const a = i * 2.39, r = k * (60 + (i % 7) * 25); c.fillStyle = `rgba(150,140,120,${Math.max(0, .8 - k)})`; c.fillRect(x + Math.cos(a) * r, y + Math.sin(a) * r * .5 + k * k * 160, 6, 6); } }
function mark(c, x, y, a, t) { if (a <= 0) return; c.save(); c.globalAlpha = a; c.translate(x, y); const s = 1 + .06 * Math.sin(t * 4); c.scale(s, s);
  glow(c, SP.red, 0, 0, 160, .5 * a); c.fillStyle = '#c0392b'; c.beginPath(); c.arc(0, 0, 26, 0, TAU); c.fill(); c.strokeStyle = '#ffd2c8'; c.lineWidth = 6; c.lineCap = 'round';
  c.beginPath(); c.moveTo(-6, -14); c.lineTo(4, -2); c.lineTo(-4, 4); c.lineTo(6, 14); c.stroke(); c.restore(); }
function siwak(c, x, y, s, a) { c.save(); c.globalAlpha = a; c.translate(x, y); c.rotate(-.5); c.fillStyle = '#8a5a2b'; c.fillRect(-s * 1.4, -s * .09, s * 2.6, s * .18); c.fillStyle = '#e8d8b0'; for (let i = 0; i < 7; i++) c.fillRect(s * 1.2, -s * .09 + i * s * .03, s * .3, s * .02); c.restore(); glow(c, SP.gold, x, y, s * 6, .5 * a); }
function stars(c, t, a) { c.fillStyle = '#fff'; for (let i = 0; i < 220; i++) { const x = PERMX[i] * W, y = PERMY[i] * H * .6; c.globalAlpha = a * (.3 + .4 * Math.sin(t * 2 + i)); c.fillRect(x, y, 2, 2); } c.globalAlpha = 1; }
const PERMX = Array.from({ length: 220 }, () => R()), PERMY = Array.from({ length: 220 }, () => R());
function arch(c, x, y, w, h) { c.beginPath(); c.moveTo(x - w / 2, y); c.lineTo(x - w / 2, y - h * .62); c.quadraticCurveTo(x - w / 2, y - h, x, y - h * 1.08); c.quadraticCurveTo(x + w / 2, y - h, x + w / 2, y - h * .62); c.lineTo(x + w / 2, y); c.closePath(); }
function _streetBG(c, t) {
  c.fillStyle = vgrad(c, 0, GY, [[0, '#7fb6dc'], [1, '#f2e2c0']]); c.fillRect(0, 0, W, H);
  const house = (x, w, h, col) => { c.fillStyle = col; c.fillRect(x, GY - h, w, h); c.fillStyle = 'rgba(0,0,0,.12)'; c.fillRect(x, GY - h, w, 16); c.fillStyle = '#5a3a26'; arch(c, x + w / 2, GY, w * .32, h * .45); c.fill();
    c.fillStyle = '#6b4a30'; c.fillRect(x + w * .14, GY - h * .8, w * .3, h * .2); c.strokeStyle = '#3a2416'; c.lineWidth = 3; for (let i = 1; i < 4; i++) { c.beginPath(); c.moveTo(x + w * .14 + i * w * .075, GY - h * .8); c.lineTo(x + w * .14 + i * w * .075, GY - h * .6); c.stroke(); } };
  house(-40, 330, 760, '#e3c9a0'); house(290, 300, 620, '#d9b88a'); house(590, 320, 820, '#e8d2ae'); house(910, 260, 680, '#d4ae80');
  c.fillStyle = vgrad(c, GY - 10, H, [[0, '#c9a77a'], [1, '#6b5034']]); c.fillRect(0, GY - 10, W, H);
}
function stall(c, x) { c.fillStyle = '#6b4226'; c.fillRect(x - 220, GY - 260, 440, 30); c.fillRect(x - 210, GY - 230, 20, 230); c.fillRect(x + 190, GY - 230, 20, 230);
  for (let i = 0; i < 8; i++) { c.fillStyle = i % 2 ? '#f4efe4' : '#c0392b'; c.beginPath(); c.moveTo(x - 240 + i * 60, GY - 560); c.lineTo(x - 180 + i * 60, GY - 560); c.lineTo(x - 180 + i * 60, GY - 500); c.quadraticCurveTo(x - 210 + i * 60, GY - 470, x - 240 + i * 60, GY - 500); c.fill(); }
  c.fillStyle = '#4a2e1c'; c.fillRect(x - 225, GY - 560, 10, 300); c.fillRect(x + 215, GY - 560, 10, 300);
  [['#e67e22', 5], ['#c0392b', 4], ['#7cb342', 5]].forEach(([col, n], j) => { for (let k = 0; k < n; k++) { c.fillStyle = col; c.beginPath(); c.arc(x - 170 + j * 140 + k * 22, GY - 282 - (k % 2) * 16, 20, 0, TAU); c.fill(); } }); }
function _fieldBG(c, t, night) {
  c.fillStyle = vgrad(c, 0, GY, night ? [[0, '#070b1c'], [1, '#26304e']] : [[0, '#8cc7ec'], [1, '#f3e2b4']]); c.fillRect(0, 0, W, H);
  if (night) { stars(c, t, .8); c.fillStyle = '#eef3ff'; c.beginPath(); c.arc(W * .8, H * .12, 50, 0, TAU); c.fill(); glow(c, SP.white, W * .8, H * .12, 400, .3); }
  c.fillStyle = night ? '#1a1f14' : '#6a8a3a'; c.beginPath(); c.moveTo(0, GY - 160); for (let x = 0; x <= W; x += 30) c.lineTo(x, GY - 160 - 30 * Math.sin(x * .006)); c.lineTo(W, H); c.lineTo(0, H); c.fill();
  // two plots with crop rows
  for (let r = 0; r < 14; r++) { const y = GY - 130 + r * 34; c.strokeStyle = night ? 'rgba(80,110,60,.6)' : (r % 2 ? '#7aa04a' : '#8db456'); c.lineWidth = 10; c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); }
  c.fillStyle = night ? 'rgba(0,0,0,.35)' : 'rgba(0,0,0,0)'; c.fillRect(0, 0, W, H);
}
function stake(c, x, y, a = 1) { c.save(); c.globalAlpha = a; c.fillStyle = '#7a5530'; c.fillRect(x - 9, y - 120, 18, 130); c.fillStyle = '#f2efe6'; c.fillRect(x - 11, y - 128, 22, 26); c.fillStyle = '#c0392b'; c.fillRect(x - 11, y - 110, 22, 6); c.restore(); }
function _officeBG(c, t) {
  c.fillStyle = vgrad(c, 0, GY, [[0, '#3b3f58'], [1, '#2a2d40']]); c.fillRect(0, 0, W, H);
  const wx = W * .56, wy = H * .14, ww = 400, wh = 520; c.fillStyle = vgrad(c, wy, wy + wh, [[0, '#6aa7d8'], [1, '#c9e2f2']]); c.fillRect(wx, wy, ww, wh);
  c.fillStyle = 'rgba(60,90,130,.6)'; for (let i = 0; i < 6; i++) c.fillRect(wx + i * 70, wy + wh - 120 - (i * 47 % 180), 60, 300);
  c.strokeStyle = '#1e2030'; c.lineWidth = 18; c.strokeRect(wx, wy, ww, wh); c.lineWidth = 8; c.beginPath(); c.moveTo(wx + ww / 2, wy); c.lineTo(wx + ww / 2, wy + wh); c.stroke();
  c.fillStyle = '#4a3226'; c.fillRect(40, GY - 640, 300, 640); c.fillStyle = '#5a3e2e'; c.fillRect(70, GY - 610, 240, 260); c.fillRect(70, GY - 320, 240, 280); c.fillStyle = '#d6b25e'; c.beginPath(); c.arc(300, GY - 320, 14, 0, TAU); c.fill();
  c.fillStyle = vgrad(c, GY - 10, H, [[0, '#5a4636'], [1, '#2a1f18']]); c.fillRect(0, GY - 10, W, H);
}
function calendar(c, x, y, t, flips) { c.fillStyle = '#efe6cf'; c.fillRect(x - 90, y - 110, 180, 220); c.fillStyle = '#b84a3a'; c.fillRect(x - 90, y - 110, 180, 50);
  c.fillStyle = 'rgba(0,0,0,.18)'; for (let r = 0; r < 4; r++) for (let q = 0; q < 5; q++) c.fillRect(x - 74 + q * 31, y - 40 + r * 34, 20, 18);
  for (const ft of flips) { const k = clamp((t - ft) / .7); if (k <= 0 || k >= 1) continue; c.save(); c.translate(x, y - 110); c.scale(1, Math.cos(k * Math.PI)); c.globalAlpha = 1 - k * .5; c.fillStyle = '#f7f0de'; c.fillRect(-90, 0, 180, 220); c.fillStyle = '#b84a3a'; c.fillRect(-90, 0, 180, 50); c.restore(); } }
function seated(c, st, x, gy, s, t, turn, extra) { chair(c, x, gy, s, turn, false);
  const pose = Object.assign(basePose(st), MOVES.sit(st, t), extra || {}, { hipH: st.P.shin + .1 }); pose.back = turn > .5; if (pose.back) { pose.handL = [-.3, -.2]; pose.handR = [.3, -.2]; }
  drawChar(c, x, gy - s * .62 + s * (st.P.shin + .1) - s * .3, s, st, pose); if (turn > .02) chair(c, x, gy, s, turn, true); desk(c, x, gy, s, t); }
function judgmentBG(c, t) {
  c.fillStyle = vgrad(c, 0, H, [[0, '#05040c'], [.55, '#1c1428'], [1, '#2a1c10']]); c.fillRect(0, 0, W, H); stars(c, t, .8);
  c.save(); c.globalCompositeOperation = 'lighter'; c.translate(W / 2, -200); for (let i = 0; i < 14; i++) { const an = Math.PI / 2 + (i - 6.5) * .09; const g = c.createLinearGradient(0, 0, Math.cos(an) * 2600, Math.sin(an) * 2600); g.addColorStop(0, 'rgba(255,230,170,.12)'); g.addColorStop(1, 'rgba(255,230,170,0)'); c.fillStyle = g; c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(an - .03) * 2600, Math.sin(an - .03) * 2600); c.lineTo(Math.cos(an + .03) * 2600, Math.sin(an + .03) * 2600); c.fill(); } c.restore();
  c.fillStyle = 'rgba(0,0,0,.4)'; c.fillRect(0, GY, W, H);
}
const BGC = mk(), BGX = BGC.getContext('2d');
function blurred(c, px, fn) { BGX.setTransform(1, 0, 0, 1, 0, 0); BGX.globalAlpha = 1; BGX.filter = 'none'; BGX.clearRect(0, 0, W, H); fn(BGX); c.save(); c.filter = `blur(${px}px)`; c.drawImage(BGC, 0, 0); c.restore(); }
function streetBG(c, t) { blurred(c, 1.6, x => _streetBG(x, t)); }
function fieldBG(c, t, n) { blurred(c, 1.4, x => _fieldBG(x, t, n)); }
function officeBG(c, t) { blurred(c, 1.6, x => _officeBG(x, t)); }
const LOGO = new Image(); LOGO.src = 'logo.png';

function bigQ(c, a) { if (a <= 0) return; c.save(); c.globalAlpha = a; c.strokeStyle = '#f3cf86'; c.lineWidth = 22; c.lineCap = 'round'; c.shadowColor = '#ffcf80'; c.shadowBlur = 30; c.beginPath(); c.arc(W / 2, H * .14, 70, Math.PI * 1.1, Math.PI * 2.4); c.quadraticCurveTo(W / 2, H * .14 + 90, W / 2, H * .14 + 130); c.stroke(); c.fillStyle = '#f3cf86'; c.beginPath(); c.arc(W / 2, H * .14 + 190, 14, 0, TAU); c.fill(); c.restore(); }
/* ============================ SCENES — «أول من يُقضى عليهم» (مسلم 1905) ============================ */
STYLES.warrior = { P: ADULT, skin: '#c8946a', shirt: '#6a2a2a', robe: true, sleeve: 'long', pants: '#4a3a30', shoe: '#3a2a20', hair: '#1e1612', cap: '#8a8f98' };
STYLES.scholar = { P: ADULT, skin: '#d2a07a', shirt: '#f2efe6', robe: true, sleeve: 'long', pants: '#e2dccb', shoe: '#5a3a26', hair: '#2a1d16', cap: '#ffffff' };
STYLES.donor = { P: ADULT, skin: '#e0b08a', shirt: '#f3f3f1', sleeve: 'long', sleeveCol: '#1f3d5a', pants: '#1f3d5a', shoe: '#141414', jacket: '#1f3d5a', tie: '#c9a046', hair: '#231914', watch: true, belly: .06 };
STYLES.poor = { P: ADULT, skin: '#c08a62', shirt: '#7d7a6e', sleeve: 'short', pants: '#5a564c', shoe: '#4a3a2a', hair: '#4a3a2a', patches: true };
const WA = STYLES.warrior, SC = STYLES.scholar, DO = STYLES.donor, POOR = STYLES.poor;
const CROWD = [YO, ME, PO, EL, STYLES.poor];
const CHEER = (st, t, i) => { const j = Math.max(0, Math.sin(t * 7 + i * 1.3)); return { handL: [-st.P.sw - .3, -st.P.T - .5 - j * .1], handR: [st.P.sw + .3, -st.P.T - .5 - j * .1], elbowL: -1, elbowR: 1, bob: -j * .04, head: -.1 }; };
const CLAP = (st, t, i) => { const k = Math.abs(Math.sin(t * 9 + i)); return { handL: [-.05 - k * .12, -st.P.T + .35], handR: [.05 + k * .12, -st.P.T + .33], elbowL: 1, elbowR: -1, head: -.06 }; };
const FILM = (st, t) => ({ handR: [st.P.sw + .25, -st.P.T + .1], elbowR: 1, propR: PROPS.phone, head: -.05 });
function crowdRow(c, t, y, s, n, x0, x1, move, back, alpha = 1) { c.save(); c.globalAlpha = alpha; for (let i = 0; i < n; i++) { const st = CROWD[i % CROWD.length], x = lerp(x0, x1, n > 1 ? i / (n - 1) : .5);
  const p = Object.assign(basePose(st), st === EL ? ELDER(t) : {}, move(st, t, i), back ? { back: true } : {}); p.face = x < W / 2 ? 1 : -1; drawChar(c, x, y, s, st, p); } c.restore(); }
function praiseBursts(c, x, y, t, a) { if (a <= 0) return; for (let i = 0; i < 7; i++) { const ph = (t * .8 + i / 7) % 1, an = -Math.PI / 2 + (i - 3) * .35, r = 80 + ph * 260; sparkle(c, x + Math.cos(an) * r, y + Math.sin(an) * r * .7, 16 * (1 - ph) + 6, a * (1 - ph)); } }
function blessings(c, x, y, k, t, kinds) { for (let i = 0; i < 6; i++) { const an = i / 6 * TAU + t * .35, r = 270; const ki = clamp(k * 6 - i); if (ki <= 0) continue; iconBless(c, kinds[i], x + Math.cos(an) * r, y + Math.sin(an) * r * .42, 52 * eBack(ki), ki); } }
function deedOrb(c, x, y, s, crack, t) { // the golden deed; cracks and turns to dust at «كذبت»
  if (crack >= 1) return; const a = 1 - ss(.55, 1, crack);
  glow(c, SP.gold, x, y, s * 6 * (1 - crack * .6), .6 * a);
  c.save(); c.globalAlpha = a; const g = c.createRadialGradient(x - s * .3, y - s * .3, 2, x, y, s); g.addColorStop(0, '#fff6d6'); g.addColorStop(1, '#d99a3a'); c.fillStyle = g; c.beginPath(); c.arc(x, y, s, 0, TAU); c.fill();
  if (crack > 0) { c.strokeStyle = '#2a1608'; c.lineWidth = 4; c.beginPath(); c.moveTo(x - s * .1, y - s); c.lineTo(x + s * .15, y - s * .2); c.lineTo(x - s * .2, y + s * .2); c.lineTo(x + s * .05, y + s); c.moveTo(x + s * .15, y - s * .2); c.lineTo(x + s * .8, y - s * .1); c.stroke(); }
