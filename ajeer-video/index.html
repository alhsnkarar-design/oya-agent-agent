<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>أعطِ الأجير أجره</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block;width:100vw;height:100vh;object-fit:contain;background:#000}
#ui{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:12px;align-items:center;background:rgba(10,8,4,.6);border:1px solid rgba(232,190,110,.35);padding:8px 16px;border-radius:40px;color:#f3d79a;font-family:sans-serif}
#ui button{background:none;border:1px solid rgba(232,190,110,.5);color:#f3d79a;border-radius:20px;padding:6px 16px;cursor:pointer}
#ui input{width:min(50vw,420px);accent-color:#d9a94e}
body.render #ui{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"><button id="play">▶</button><input id="seek" type="range" min="0" max="80" step="0.01" value="0"><span id="tm">0:00</span></div>
<audio id="aud" src="soundtrack.wav" preload="auto"></audio>
<script src="rig.js"></script>
<script>
/* «أعطِ الأجير أجره» — فيديو توعوي عمودي بشخصيات كرتونية بلا ملامح وجه.
   كل إطار دالة نقية في الزمن t؛ لا نصوص على الشاشة. */
const W = 1080, H = 1920, FPS = 30, DUR = 80;
const cv = document.getElementById('c'); cv.width = W; cv.height = H; const ctx = cv.getContext('2d');
const mk = (w = W, h = H) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const buf = mk(), bctx = buf.getContext('2d');
const pulse = (t, c, w) => Math.exp(-Math.pow((t - c) / w, 2));
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(4242);
function sprite(r, g, b, size = 128) { const c = mk(size, size), x = c.getContext('2d'); const gr = x.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.15, `rgba(${r},${g},${b},.85)`); gr.addColorStop(.45, `rgba(${r},${g},${b},.25)`); gr.addColorStop(1, `rgba(${r},${g},${b},0)`); x.fillStyle = gr; x.fillRect(0, 0, size, size); return c; }
const SP = { gold: sprite(255, 196, 90), warm: sprite(255, 150, 70), blue: sprite(120, 190, 255), white: sprite(230, 240, 255) };
function glow(c, sp, x, y, s, a = 1) { if (a <= .003) return; c.save(); c.globalCompositeOperation = 'lighter'; c.globalAlpha = a; c.drawImage(sp, x - s / 2, y - s / 2, s, s); c.restore(); }
function vgrad(c, y0, y1, stops) { const g = c.createLinearGradient(0, y0, 0, y1); stops.forEach(([o, col]) => g.addColorStop(o, col)); return g; }
function star8(c, cx, cy, Rr, rot) { const ri = Rr * Math.cos(Math.PI / 4) / Math.cos(Math.PI / 8); c.beginPath(); for (let i = 0; i < 16; i++) { const r = i % 2 ? ri : Rr, an = rot + i * Math.PI / 8; c.lineTo(cx + r * Math.cos(an), cy + r * Math.sin(an)); } c.closePath(); }

/* pose sequencing (crossfade between moves) */
function mixP(a, b, k) { const o = {}; for (const key of new Set([...Object.keys(a), ...Object.keys(b)])) { const va = a[key], vb = b[key];
  if (Array.isArray(va) && Array.isArray(vb)) o[key] = [lerp(va[0], vb[0], k), lerp(va[1], vb[1], k)]; else if (typeof va === 'number' && typeof vb === 'number') o[key] = lerp(va, vb, k); else o[key] = k < .5 ? (va ?? vb) : (vb ?? va); } return o; }
function seq(st, t, list) { let i = 0; while (i + 1 < list.length && t >= list[i + 1][0]) i++;
  const cur = Object.assign(basePose(st), list[i][1](t - list[i][0]));
  if (i > 0) { const k = eInOut((t - list[i][0]) / .45); if (k < 1) return mixP(Object.assign(basePose(st), list[i - 1][1](t - list[i - 1][0])), cur, k); } return cur; }
const WK = STYLES.worker, BS = STYLES.boss, CH = STYLES.child;
const GY = H * .8, S = 250;
function headTop(x, gy, s, st) { const P = st.P; return [x, gy - s * ((P.thigh + P.shin) * .985 + P.T + P.neck + P.headR * 1.9)]; }
function bossSeated(c, x, gy, s, t, turn, extra) {
  chair(c, x, gy, s, turn, false);
  const pose = Object.assign(basePose(BS), MOVES.sit(BS, t), extra || {}, { hipH: BS.P.shin + .1 });
  pose.back = turn > .5; if (pose.back) { pose.handL = [-.3, -.2]; pose.handR = [.3, -.2]; }
  drawChar(c, x, gy - s * .62 + s * (BS.P.shin + .1) - s * .3, s, BS, pose);
  if (turn > .02) chair(c, x, gy, s, turn, true);
  desk(c, x, gy, s, t);
}

/* ---------------- environments ---------------- */
function constructionBG(c, t, mood) { // mood 0 dawn → 1 noon
  c.fillStyle = vgrad(c, 0, GY, [[0, mood ? '#3b8fd0' : '#2a2350'], [.55, mood ? '#8cc7ec' : '#e3735a'], [1, mood ? '#f3e2b4' : '#ffc46e']]); c.fillRect(0, 0, W, H);
  const sx = mood ? W * .72 : W * .2, sy = mood ? H * .16 : H * .5 - t * 12;
  glow(c, SP.gold, sx, sy, mood ? 900 : 1100, mood ? .7 : .6); c.fillStyle = mood ? '#fff6d8' : '#ffe0a0'; c.beginPath(); c.arc(sx, sy, mood ? 95 : 110, 0, TAU); c.fill();
  if (mood) { c.save(); c.translate(sx, sy); c.rotate(t * .2); c.strokeStyle = 'rgba(255,240,190,.45)'; c.lineWidth = 6; for (let i = 0; i < 12; i++) { c.rotate(TAU / 12); c.beginPath(); c.moveTo(125, 0); c.lineTo(170 + 15 * Math.sin(t * 4 + i), 0); c.stroke(); } c.restore(); }
  // city silhouettes
  c.fillStyle = mood ? 'rgba(80,110,140,.45)' : 'rgba(70,40,70,.6)';
  for (let i = 0; i < 9; i++) { const bx = i * 130 - 20, bh = 260 + (i * 83 % 240); c.fillRect(bx, GY - 140 - bh, 110, bh + 140); }
  // crane
  c.strokeStyle = mood ? '#d9a33a' : '#3a2238'; c.lineWidth = 12; c.beginPath(); c.moveTo(W * .82, GY - 100); c.lineTo(W * .82, H * .2); c.lineTo(W * .2, H * .2); c.stroke();
  c.lineWidth = 4; c.beginPath(); c.moveTo(W * .82, H * .2); c.lineTo(W * .92, H * .26); c.moveTo(W * .82, H * .14); c.lineTo(W * .82, H * .2); c.stroke();
  const hookX = W * .45 + Math.sin(t * .6) * 20; c.beginPath(); c.moveTo(hookX, H * .2); c.lineTo(hookX, H * .32); c.stroke();
  c.fillStyle = c.strokeStyle; c.fillRect(hookX - 14, H * .32, 28, 20);
  // ground
  c.fillStyle = vgrad(c, GY - 10, H, [[0, mood ? '#b48a5a' : '#6b4a3a'], [1, mood ? '#7a5634' : '#2e1e18']]); c.fillRect(0, GY - 10, W, H - GY + 10);
  c.fillStyle = 'rgba(0,0,0,.12)'; for (let i = 0; i < 40; i++) c.fillRect((i * 97) % W, GY + 30 + (i * 53) % 300, 30, 6);
  // brick pile
  for (let r = 0; r < 4; r++) for (let k = 0; k < 4 - r; k++) { c.fillStyle = (r + k) % 2 ? '#a9472a' : '#b85634'; c.fillRect(W * .78 + k * 58 + r * 29, GY - 30 - r * 30, 54, 28); }
}
function wall(c, x, y, cols, rows, prog, glowA = 0) { // prog: number of bricks placed
  const bw = 78, bh = 38; let n = 0;
  for (let r = 0; r < rows; r++) for (let k = 0; k < cols; k++) {
    if (n++ >= prog) return; const off = r % 2 ? bw / 2 : 0, bx = x + k * bw + off - (r % 2 && k === cols - 1 ? 0 : 0), by = y - (r + 1) * bh;
    const f = clamp(prog - n + 1); c.save(); c.globalAlpha = f; c.translate(0, (1 - f) * -40);
    c.fillStyle = (r * 3 + k) % 4 === 0 ? '#a9472a' : '#bb5a36'; c.fillRect(bx + 2, by + 2, bw - 4, bh - 4);
    c.fillStyle = 'rgba(255,255,255,.12)'; c.fillRect(bx + 2, by + 2, bw - 4, 7); c.restore();
  }
  if (glowA > 0) glow(c, SP.gold, x + cols * bw / 2, y - rows * bh / 2, 900, glowA);
}
function scaffold(c, x, y, w, h) { c.strokeStyle = '#7a8a96'; c.lineWidth = 8; for (let i = 0; i <= 2; i++) { c.beginPath(); c.moveTo(x + i * w / 2, y); c.lineTo(x + i * w / 2, y - h); c.stroke(); } for (let j = 1; j <= 3; j++) { c.beginPath(); c.moveTo(x, y - j * h / 3); c.lineTo(x + w, y - j * h / 3); c.stroke(); } c.lineWidth = 4; c.beginPath(); c.moveTo(x, y); c.lineTo(x + w / 2, y - h / 3); c.moveTo(x + w / 2, y - h / 3); c.lineTo(x + w, y - 2 * h / 3); c.stroke(); }
function officeBG(c, t, dim = 0) {
  c.fillStyle = vgrad(c, 0, GY, [[0, '#3b3f58'], [1, '#2a2d40']]); c.fillRect(0, 0, W, H);
  // window with city
  const wx = W * .56, wy = H * .14, ww = 400, wh = 520;
  c.fillStyle = vgrad(c, wy, wy + wh, [[0, '#6aa7d8'], [1, '#c9e2f2']]); c.fillRect(wx, wy, ww, wh);
  c.fillStyle = 'rgba(60,90,130,.6)'; for (let i = 0; i < 6; i++) c.fillRect(wx + i * 70, wy + wh - 120 - (i * 47 % 180), 60, 300);
  c.strokeStyle = '#1e2030'; c.lineWidth = 18; c.strokeRect(wx, wy, ww, wh); c.lineWidth = 8; c.beginPath(); c.moveTo(wx + ww / 2, wy); c.lineTo(wx + ww / 2, wy + wh); c.stroke();
  // door
  c.fillStyle = '#4a3226'; c.fillRect(40, GY - 640, 300, 640); c.fillStyle = '#5a3e2e'; c.fillRect(70, GY - 610, 240, 260); c.fillRect(70, GY - 320, 240, 280); c.fillStyle = '#d6b25e'; c.beginPath(); c.arc(300, GY - 320, 14, 0, TAU); c.fill();
  // frame / certificate (no text)
  c.fillStyle = '#d6b25e'; c.fillRect(W * .28, H * .17, 170, 130); c.fillStyle = '#efe6cf'; c.fillRect(W * .28 + 12, H * .17 + 12, 146, 106); c.fillStyle = 'rgba(0,0,0,.15)'; for (let i = 0; i < 4; i++) c.fillRect(W * .28 + 30, H * .17 + 35 + i * 18, 110 - i * 15, 6);
  // plant
  c.fillStyle = '#6b4a3a'; c.fillRect(W - 170, GY - 120, 110, 120); c.fillStyle = '#3f8a5a'; for (let i = 0; i < 7; i++) { c.save(); c.translate(W - 115, GY - 120); c.rotate(-1.4 + i * .45 + Math.sin(t + i) * .03); c.beginPath(); c.ellipse(0, -90, 26, 95, 0, 0, TAU); c.fill(); c.restore(); }
  // floor
  c.fillStyle = vgrad(c, GY - 10, H, [[0, '#5a4636'], [1, '#2a1f18']]); c.fillRect(0, GY - 10, W, H - GY + 10);
  c.strokeStyle = 'rgba(0,0,0,.18)'; c.lineWidth = 3; for (let i = 0; i < 12; i++) { c.beginPath(); c.moveTo(i * 110, GY); c.lineTo(i * 160 - 300, H); c.stroke(); }
  if (dim) { c.fillStyle = `rgba(0,0,0,${dim})`; c.fillRect(0, 0, W, H); }
}
function calendar(c, x, y, t, flips) { // flips: times of page turns
  c.fillStyle = '#efe6cf'; c.fillRect(x - 90, y - 110, 180, 220); c.fillStyle = '#b84a3a'; c.fillRect(x - 90, y - 110, 180, 50);
  c.fillStyle = 'rgba(0,0,0,.18)'; for (let r = 0; r < 4; r++) for (let q = 0; q < 5; q++) c.fillRect(x - 74 + q * 31, y - 40 + r * 34, 20, 18);
  for (const ft of flips) { const k = clamp((t - ft) / .7); if (k <= 0 || k >= 1) continue;
    c.save(); c.translate(x, y - 110); c.scale(1, Math.cos(k * Math.PI)); c.globalAlpha = 1 - k * .5; c.fillStyle = '#f7f0de'; c.fillRect(-90, 0, 180, 220); c.fillStyle = '#b84a3a'; c.fillRect(-90, 0, 180, 50); c.restore(); }
}
function homeBG(c, t, warm) {
  c.fillStyle = vgrad(c, 0, GY, [[0, warm ? '#6b4a3a' : '#2a2430'], [1, warm ? '#8a5e44' : '#1d1820']]); c.fillRect(0, 0, W, H);
  // window night
  const wx = W * .12, wy = H * .16; c.fillStyle = vgrad(c, wy, wy + 420, [[0, '#0b1230'], [1, '#1d2a55']]); c.fillRect(wx, wy, 340, 420);
  c.fillStyle = '#eef3ff'; c.beginPath(); c.arc(wx + 240, wy + 110, 46, 0, TAU); c.fill(); c.fillStyle = warm ? '#7a563f' : '#2a2430'; c.beginPath(); c.arc(wx + 262, wy + 96, 42, 0, TAU); c.fill();
  c.fillStyle = '#fff'; for (let i = 0; i < 12; i++) c.fillRect(wx + (i * 67) % 320 + 10, wy + (i * 41) % 300 + 20, 3, 3);
  c.strokeStyle = '#2a1e18'; c.lineWidth = 16; c.strokeRect(wx, wy, 340, 420); c.lineWidth = 8; c.beginPath(); c.moveTo(wx + 170, wy); c.lineTo(wx + 170, wy + 420); c.stroke();
  // shelf with child's drawing frame
  c.fillStyle = '#4a3226'; c.fillRect(W * .58, H * .26, 340, 18); c.fillStyle = '#e8d9a8'; c.fillRect(W * .62, H * .26 - 120, 100, 120); c.fillStyle = '#d9534f'; c.beginPath(); c.arc(W * .62 + 50, H * .26 - 70, 22, 0, TAU); c.fill();
  // hook with helmet spot
  c.fillStyle = '#3a2a20'; c.fillRect(W * .82, H * .36, 18, 40);
  // floor
  c.fillStyle = vgrad(c, GY - 10, H, [[0, warm ? '#6b4632' : '#2a1f22'], [1, '#140e10']]); c.fillRect(0, GY - 10, W, H - GY + 10);
  // rug
  c.fillStyle = warm ? '#9e3a3a' : '#4a1e24'; c.beginPath(); c.ellipse(W * .5, GY + 140, 420, 80, 0, 0, TAU); c.fill(); c.strokeStyle = '#d6a94f'; c.lineWidth = 6; c.stroke();
}
function lamp(c, x, y, t, on) { c.strokeStyle = '#111'; c.lineWidth = 4; c.beginPath(); c.moveTo(x, 0); c.lineTo(x, y); c.stroke();
  c.fillStyle = '#3a3a3a'; c.beginPath(); c.moveTo(x - 70, y + 50); c.lineTo(x + 70, y + 50); c.lineTo(x + 30, y); c.lineTo(x - 30, y); c.fill();
  c.fillStyle = on > .2 ? '#fff2c8' : '#665a40'; c.beginPath(); c.arc(x, y + 55, 22, 0, TAU); c.fill();
  glow(c, SP.warm, x, y + 120, 1300, .45 * on); glow(c, SP.gold, x, y + 55, 200, .7 * on);
  if (on > .05) { c.save(); c.globalAlpha = .1 * on; c.fillStyle = '#ffd890'; c.beginPath(); c.moveTo(x - 60, y + 50); c.lineTo(x + 60, y + 50); c.lineTo(x + 420, GY + 200); c.lineTo(x - 420, GY + 200); c.fill(); c.restore(); }
}
function table(c, x, y, t, full) { c.fillStyle = '#5a3a26'; c.fillRect(x - 200, y - 260, 400, 26); c.fillRect(x - 180, y - 236, 22, 236); c.fillRect(x + 158, y - 236, 22, 236);
  c.fillStyle = '#efe9dc'; c.beginPath(); c.ellipse(x - 30, y - 268, 90, 20, 0, 0, TAU); c.fill(); c.fillStyle = '#d9d0bd'; c.beginPath(); c.ellipse(x - 30, y - 270, 62, 12, 0, 0, TAU); c.fill();
  if (full) { c.fillStyle = '#e8b04a'; c.beginPath(); c.ellipse(x - 30, y - 284, 58, 22, 0, Math.PI, 0); c.fill(); c.fillStyle = '#5aa04a'; c.beginPath(); c.arc(x - 55, y - 296, 14, 0, TAU); c.fill(); c.fillStyle = '#d9534f'; c.beginPath(); c.arc(x - 10, y - 298, 12, 0, TAU); c.fill();
    c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 4; for (let k = 0; k < 3; k++) { c.beginPath(); for (let i = 0; i <= 12; i++) { const u = i / 12; c.lineTo(x - 55 + k * 25 + Math.sin(u * 6 + t * 2 + k) * 8, y - 310 - u * 90); } c.stroke(); }
    c.fillStyle = '#c98a3a'; c.fillRect(x + 70, y - 300, 70, 40); c.fillStyle = '#f2c46a'; c.fillRect(x + 70, y - 300, 70, 10);
  } else { // bills
    for (let i = 0; i < 4; i++) { c.save(); c.translate(x + 100, y - 266 - i * 6); c.rotate(-.15 + i * .1); c.fillStyle = i % 2 ? '#f2efe6' : '#e8e2d2'; c.fillRect(-55, -8, 110, 8); c.restore(); }
    c.fillStyle = '#b84a3a'; c.save(); c.translate(x + 100, y - 296); c.rotate(.08); c.fillRect(-50, -6, 100, 6); c.restore();
  }
}
function scale(c, cx, cy, sz, tilt, leftItem, rightItem, a = 1) {
  c.save(); c.globalAlpha = a; c.strokeStyle = '#f3cf86'; c.fillStyle = '#f3cf86'; c.lineWidth = 10; c.shadowColor = 'rgba(255,200,110,.9)'; c.shadowBlur = 30;
  c.beginPath(); c.moveTo(cx, cy - sz * .1); c.lineTo(cx, cy + sz * 1.1); c.stroke(); c.fillRect(cx - sz * .35, cy + sz * 1.1, sz * .7, 18);
  c.beginPath(); c.arc(cx, cy - sz * .15, 22, 0, TAU); c.fill();
  const bx = Math.cos(tilt) * sz, by = Math.sin(tilt) * sz;
  c.beginPath(); c.moveTo(cx - bx, cy - by); c.lineTo(cx + bx, cy + by); c.stroke();
  [[-1, leftItem], [1, rightItem]].forEach(([s, item]) => { const px = cx + s * bx, py = cy + s * by; c.lineWidth = 3;
    c.beginPath(); c.moveTo(px, py); c.lineTo(px - sz * .3, py + sz * .55); c.moveTo(px, py); c.lineTo(px + sz * .3, py + sz * .55); c.stroke();
    c.beginPath(); c.ellipse(px, py + sz * .58, sz * .34, sz * .07, 0, 0, Math.PI); c.fill(); c.shadowBlur = 0; if (item) item(px, py + sz * .5); c.shadowBlur = 30; });
  c.restore();
}
function drop(c, x, y, s, a = 1) { c.save(); c.globalAlpha = a; c.fillStyle = '#8fd0ff'; c.beginPath(); c.moveTo(x, y - s); c.quadraticCurveTo(x + s * .75, y + s * .25, x, y + s * .6); c.quadraticCurveTo(x - s * .75, y + s * .25, x, y - s); c.fill(); c.fillStyle = 'rgba(255,255,255,.7)'; c.beginPath(); c.ellipse(x - s * .2, y, s * .12, s * .22, -.3, 0, TAU); c.fill(); c.restore(); glow(c, SP.blue, x, y, s * 6, .4 * a); }
function envelopeBig(c, x, y, s, rot = 0, a = 1) { c.save(); c.globalAlpha = a; c.translate(x, y); c.rotate(rot); c.scale(s, s); c.fillStyle = '#e8c766'; c.fillRect(-1, -.65, 2, 1.3); c.strokeStyle = '#a8862e'; c.lineWidth = .08; c.beginPath(); c.moveTo(-1, -.62); c.lineTo(0, .1); c.lineTo(1, -.62); c.stroke(); c.restore(); glow(c, SP.gold, x, y, s * 6, .35 * a); }
function clockFace(c, cx, cy, r, h, m) { c.fillStyle = '#f7f0de'; c.beginPath(); c.arc(cx, cy, r, 0, TAU); c.fill(); c.strokeStyle = '#3a2a20'; c.lineWidth = 14; c.stroke();
  for (let i = 0; i < 12; i++) { const an = i / 12 * TAU; c.lineWidth = i % 3 ? 4 : 9; c.beginPath(); c.moveTo(cx + Math.cos(an) * r * .78, cy + Math.sin(an) * r * .78); c.lineTo(cx + Math.cos(an) * r * .9, cy + Math.sin(an) * r * .9); c.stroke(); }
  const hand = (an, L, w) => { c.lineWidth = w; c.lineCap = 'round'; c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + Math.cos(an - Math.PI / 2) * L, cy + Math.sin(an - Math.PI / 2) * L); c.stroke(); };
  hand(h, r * .5, 14); hand(m, r * .75, 8); c.fillStyle = '#b84a3a'; c.beginPath(); c.arc(cx, cy, 14, 0, TAU); c.fill(); }

/* ============================ SCENES ============================ */
// 1 · 0–7.5 dawn: worker arrives first, carries the first brick
function sc1(c, lt) {
  constructionBG(c, lt, 0); scaffold(c, W * .08, GY, 300, 620); wall(c, W * .1, GY, 5, 6, 12 + (lt > 5.6 ? 1 : 0));
  const x = lerp(W * .95, W * .62, eInOut((lt - .3) / 5)), walking = lt > .3 && lt < 5.3;
  const pose = seq(WK, lt, [[0, u => MOVES.idle(WK, u)], [.3, u => Object.assign(MOVES.walk(WK, u, 1, true), { propR: PROPS.brick })], [5.3, u => Object.assign(MOVES.give(WK, u, eOut(u / .6)), { propR: u < .5 ? PROPS.brick : null, head: .1 })], [6.3, u => MOVES.idle(WK, u)]]);
  pose.face = -1; drawChar(c, x, GY, S, WK, pose);
}
// 2 · 7–16.5 noon: the wall rises, sweat falls
function sc2(c, lt) {
  const z = 1 + lt * .012; c.save(); c.translate(W / 2, GY); c.scale(z, z); c.translate(-W / 2, -GY);
  constructionBG(c, lt, 1); scaffold(c, W * .08, GY, 300, 620);
  // heat shimmer lines
  c.strokeStyle = 'rgba(255,255,255,.12)'; c.lineWidth = 3; for (let i = 0; i < 6; i++) { c.beginPath(); for (let y = 0; y < 300; y += 10) c.lineTo(W * (.15 + i * .15) + Math.sin(y * .05 + lt * 4 + i) * 8, GY - 200 - y); c.stroke(); }
