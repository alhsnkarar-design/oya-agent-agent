<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<style>
@font-face{font-family:'Amiri';src:url(fonts/Amiri-Regular.ttf) format('truetype');font-weight:400}
@font-face{font-family:'Amiri';src:url(fonts/Amiri-Bold.ttf) format('truetype');font-weight:700}

 background:rgba(10,8,4,.6);border:1px solid rgba(232,190,110,.35);padding:8px 16px;border-radius:40px;color:#f3d79a;backdrop-filter:blur(6px)}

<body>
<canvas id="c"></canvas>
<div id="ui"><button id="play">▶ تشغيل</button><input id="seek" type="range" min="0" max="100" step="0.01" value="0"><span id="tm">0:00</span></div>
<audio id="aud" src="soundtrack.wav" preload="auto"></audio>
<script>
'use strict';
/* =====================================================================
   قصة نبي الله موسى عليه السلام — موشن جرافيك إجرائي بالكامل (Canvas 2D)
   كل إطار دالة نقية في الزمن t ⇒ يمكن رسم أي إطار بشكل مستقل (تصيير متوازي).
   احترامًا للأنبياء: لا يُجسَّد أي نبي؛ القصة تُروى بالرموز والضوء والطبيعة.
   ===================================================================== */
const W = 1920, H = 1080, FPS = 30, DUR = 100;
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
const mk = (w = W, h = H) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const buf = mk(), bctx = buf.getContext('2d');

/* ---------- math ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ss = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const eOut = t => 1 - Math.pow(1 - clamp(t), 3);
const eInOut = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const TAU = Math.PI * 2;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(20261102);
const PERM = new Float32Array(4096).map(() => R());
function n1(x) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(PERM[i & 4095], PERM[(i + 1) & 4095], u) * 2 - 1; }
function fbm(x, o = 4) { let s = 0, a = .5, f = 1; for (let i = 0; i < o; i++) { s += a * n1(x * f + i * 31.7); f *= 2.03; a *= .5; } return s; }
const pulse = (t, c, w) => Math.exp(-Math.pow((t - c) / w, 2));

/* ---------- glow sprites (pre-rendered, tinted) ---------- */
function sprite(r, g, b, size = 128, hard = .0) {
  const c = mk(size, size), x = c.getContext('2d');
  const gr = x.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  gr.addColorStop(0, `rgba(255,255,255,1)`);
  gr.addColorStop(.15 + hard, `rgba(${r},${g},${b},.85)`);
  gr.addColorStop(.45, `rgba(${r},${g},${b},.25)`);
  gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
  x.fillStyle = gr; x.fillRect(0, 0, size, size); return c;
}
const SP = {
  gold: sprite(255, 196, 90), fire: sprite(255, 120, 30), ember: sprite(255, 70, 20),
  white: sprite(220, 235, 255), cyan: sprite(90, 200, 255), violet: sprite(170, 70, 255), green: sprite(180, 255, 140)
};
function glow(c, sp, x, y, s, a = 1) { if (a <= 0.003) return; c.globalAlpha = a; c.drawImage(sp, x - s / 2, y - s / 2, s, s); }

/* ---------- star field ---------- */
const STARS = Array.from({ length: 900 }, () => ({ x: R() * W, y: R() * H, r: Math.pow(R(), 3) * 2.2 + .3, b: R(), p: R() * TAU }));
function drawStars(c, t, a = 1, ymax = H, ox = 0) {
  c.save(); c.fillStyle = '#fff';
  for (const s of STARS) {
    if (s.y > ymax) continue;
    const tw = .55 + .45 * Math.sin(t * (1 + s.b * 2) + s.p);
    c.globalAlpha = a * tw * (.25 + .75 * s.b) * (1 - s.y / ymax * .6);
    const x = ((s.x + ox) % W + W) % W;
    c.fillRect(x, s.y, s.r, s.r);
    if (s.r > 2) glow(c, SP.white, x, s.y, 14, a * tw * .35);
  }
  c.restore();
}

/* ---------- text engine (RTL wipe reveal + glow, cached) ---------- */
const STY = {
  verse: { font: '700 60px Amiri', fill: 'gold', glow: 'rgba(255,190,90,.75)', blur: 26, max: W * .86 },
  verseS: { font: '700 52px Amiri', fill: 'gold', glow: 'rgba(255,190,90,.75)', blur: 22, max: W * .88 },
  ref: { font: '700 26px ReemKufi', fill: '#e9d3a6', glow: 'rgba(0,0,0,.9)', blur: 8, max: W },
  chapNum: { font: '700 30px ReemKufi', fill: '#e2b765', glow: 'rgba(0,0,0,.9)', blur: 10, max: W },
  chapTitle: { font: '700 96px Ruqaa', fill: 'white', glow: 'rgba(255,200,120,.55)', blur: 30, max: W * .9 },
  title: { font: '700 150px Ruqaa', fill: 'gold', glow: 'rgba(255,190,90,.8)', blur: 40, max: W * .9 },
  basmala: { font: '700 64px Amiri', fill: '#f6e7c4', glow: 'rgba(255,200,120,.6)', blur: 24, max: W },
  sub: { font: '700 40px ReemKufi', fill: '#e9d3a6', glow: 'rgba(0,0,0,.8)', blur: 12, max: W },
  big: { font: '700 92px Amiri', fill: 'gold', glow: 'rgba(255,200,110,.85)', blur: 36, max: W * .9 },
  narr: { font: '700 50px ReemKufi', fill: '#fff1d6', glow: 'rgba(255,170,80,.55)', blur: 16, max: W * .86 },
  lesson: { font: '700 48px ReemKufi', fill: '#fff4dc', glow: 'rgba(255,170,80,.6)', blur: 18, max: W * .92 },
};
const tcache = new Map();
function textImg(str, st) {
  const key = str + '|' + st.font;
  let e = tcache.get(key); if (e) return e;
  const m = mk(10, 10).getContext('2d');
  let font = st.font; m.font = font;
  let w = m.measureText(str).width;
  const size = parseFloat(font.match(/(\d+)px/)[1]);
  if (w > st.max) { const ns = Math.floor(size * st.max / w); font = font.replace(/\d+px/, ns + 'px'); m.font = font; w = m.measureText(str).width; }
  const fs = parseFloat(font.match(/(\d+)px/)[1]);
  const pad = 60, cw = Math.ceil(w + pad * 2), ch = Math.ceil(fs * 2.1 + pad * 2);
  const c = mk(cw, ch), x = c.getContext('2d');
  x.font = font; x.direction = 'rtl'; x.textAlign = 'center'; x.textBaseline = 'middle';
  let fill = st.fill;
  if (fill === 'gold') {
    const g = x.createLinearGradient(0, ch / 2 - fs * .7, 0, ch / 2 + fs * .7);
    g.addColorStop(0, '#fff3c8'); g.addColorStop(.45, '#f1c56a'); g.addColorStop(.75, '#c98b2e'); g.addColorStop(1, '#ffe39a'); fill = g;
  }
  x.shadowColor = st.glow; x.shadowBlur = st.blur; x.fillStyle = fill;
  x.fillText(str, cw / 2, ch / 2); x.shadowBlur = st.blur * .35; x.fillText(str, cw / 2, ch / 2);
  x.shadowBlur = 0; x.fillText(str, cw / 2, ch / 2);
  e = { c, w: cw, h: ch, tw: w }; tcache.set(key, e); return e;
}
const scratch = mk(W, 400), sx = scratch.getContext('2d');
/* p: progress of RTL reveal 0..1 ; a: alpha */
function drawText(c, str, cx, cy, st, p = 1, a = 1, rise = 18) {
  if (a <= 0.003 || p <= 0) return;
  const im = textImg(str, st); p = clamp(p);
  const y = cy - im.h / 2 + (1 - eOut(p)) * rise;
  c.save(); c.globalAlpha = a;
  if (p >= 1) { c.drawImage(im.c, cx - im.w / 2, y); c.restore(); return; }
  if (scratch.width < im.w || scratch.height < im.h) { scratch.width = Math.max(scratch.width, im.w); scratch.height = Math.max(scratch.height, im.h); }
  sx.setTransform(1, 0, 0, 1, 0, 0); sx.globalCompositeOperation = 'source-over'; sx.clearRect(0, 0, im.w, im.h);
  sx.drawImage(im.c, 0, 0); sx.globalCompositeOperation = 'destination-in';
  const F = 160, e = (im.w + F) * (1 - eInOut(p));
  const g = sx.createLinearGradient(e - F, 0, e, 0); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,1)');
  sx.fillStyle = g; sx.fillRect(0, 0, im.w, im.h); sx.globalCompositeOperation = 'source-over';
  c.drawImage(scratch, 0, 0, im.w, im.h, cx - im.w / 2, y, im.w, im.h);
  // the leading edge sparkle
  c.globalCompositeOperation = 'lighter';
  glow(c, SP.gold, cx - im.w / 2 + e - F * .4, cy, 90, a * .55 * Math.sin(Math.PI * p));
  c.restore();
}
/* ornament line with diamond */
function ornament(c, cx, cy, half, a) {
  if (a <= 0 || half <= 1) return;
  c.save(); c.globalAlpha = a;
  const g = c.createLinearGradient(cx - half, 0, cx + half, 0);
  g.addColorStop(0, 'rgba(230,180,90,0)'); g.addColorStop(.5, 'rgba(240,200,120,1)'); g.addColorStop(1, 'rgba(230,180,90,0)');
  c.fillStyle = g; c.fillRect(cx - half, cy - 1, half * 2, 2);
  c.translate(cx, cy); c.rotate(Math.PI / 4); c.fillStyle = '#f3cf86'; c.fillRect(-6, -6, 12, 12);
  c.strokeStyle = 'rgba(243,207,134,.6)'; c.lineWidth = 1.5; c.strokeRect(-11, -11, 22, 22);
  c.restore();
}
/* verse block: lines revealed RTL one after another */
function verse(c, lt, a, b, lines, ref, y = H * .80, st = STY.verse) {
  if (lt < a || lt > b + 1) return;
  const out = 1 - ss(b, b + 1, lt), inA = ss(a, a + .8, lt), al = out * inA;
  const lh = parseFloat(st.font.match(/(\d+)px/)[1]) * 1.55, n = lines.length;
  const top = y - (n - 1) * lh / 2;
  c.save();
  const bh = n * lh + 150, g = c.createLinearGradient(0, top - bh / 2, 0, top + bh);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.35, 'rgba(0,0,0,.55)'); g.addColorStop(.7, 'rgba(0,0,0,.55)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  c.globalAlpha = al * .9; c.fillStyle = g; c.fillRect(0, top - bh / 2, W, bh * 1.5);
  c.restore();
  lines.forEach((ln, i) => drawText(c, ln, W / 2, top + i * lh, st, (lt - a - i * .9) / 1.8, out));
  const ry = top + (n - 1) * lh + lh * .62 + 16;
  if (ref) {
  }
}
function chapter(c, lt, num, title, a = .6, b = 4.2, y = H * .5) {
  if (lt < a || lt > b + 1) return;
  const out = 1 - ss(b, b + .9, lt);
  c.save(); c.globalAlpha = out * ss(a, a + .8, lt) * .6;
  const g = c.createRadialGradient(W / 2, y, 10, W / 2, y, 620); g.addColorStop(0, 'rgba(0,0,0,.75)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = g; c.fillRect(0, 0, W, H); c.restore();
}

/* ---------- islamic geometry ---------- */
function star8(c, cx, cy, Rr, rot) {
  const ri = Rr * Math.cos(Math.PI / 4) / Math.cos(Math.PI / 8);
  c.beginPath();
  for (let i = 0; i < 16; i++) { const r = i % 2 ? ri : Rr, an = rot + i * Math.PI / 8 - Math.PI / 2; const x = cx + r * Math.cos(an), y = cy + r * Math.sin(an); i ? c.lineTo(x, y) : c.moveTo(x, y); }
  c.closePath();
}
function star8Points(n, Rr) {
  const ri = Rr * Math.cos(Math.PI / 4) / Math.cos(Math.PI / 8), v = [];
  for (let i = 0; i < 16; i++) { const r = i % 2 ? ri : Rr, an = i * Math.PI / 8 - Math.PI / 2; v.push([r * Math.cos(an), r * Math.sin(an)]); }
  const pts = [];
  for (let k = 0; k < n; k++) { const u = k / n * 16, i = Math.floor(u), f = u - i, a = v[i], b = v[(i + 1) % 16]; pts.push([lerp(a[0], b[0], f), lerp(a[1], b[1], f)]); }
  return pts;
}
function pattern(c, cx, cy, rot, a, sp = 170, col = 'rgba(230,185,100,1)') {
  if (a <= 0) return;
  c.save(); c.globalAlpha = a; c.strokeStyle = col; c.lineWidth = 1.2;
  c.translate(cx, cy); c.rotate(rot);
  for (let gx = -7; gx <= 7; gx++) for (let gy = -5; gy <= 5; gy++) {
    const x = gx * sp, y = gy * sp; star8(c, x, y, sp * .42, 0); c.stroke();
    c.beginPath(); c.arc(x, y, sp * .2, 0, TAU); c.stroke();
    c.beginPath(); c.moveTo(x + sp * .42, y); c.lineTo(x + sp * .58, y); c.moveTo(x, y + sp * .42); c.lineTo(x, y + sp * .58); c.stroke();
  }
  c.restore();
}
/* ---------- nature helpers ---------- */
function palm(c, x, y, h, sway, col, lean = 0) {
  c.save(); c.fillStyle = col; c.strokeStyle = col;
  const tx = x + lean * h + sway * h * .08, ty = y - h;
  c.lineWidth = h * .045; c.lineCap = 'round';
  c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + lean * h * .3, y - h * .5, tx, ty); c.stroke();
  for (let i = 0; i < 9; i++) {
    const an = -Math.PI / 2 + (i - 4) * .38 + sway * .15 + Math.sin(i * 7.1) * .1, L = h * (.42 + .1 * Math.sin(i * 3.3));
    const ex = tx + Math.cos(an) * L, ey = ty + Math.sin(an) * L * .55 + L * .35;
    const mx = tx + Math.cos(an) * L * .5, my = ty + Math.sin(an) * L * .5 - L * .05;
    c.beginPath(); c.moveTo(tx, ty);
    c.quadraticCurveTo(mx, my - h * .05, ex, ey);
    c.quadraticCurveTo(mx, my + h * .02, tx, ty); c.fill();
  }
  c.restore();
}
function ridge(c, y0, amp, freq, off, col, rim) {
  c.beginPath(); c.moveTo(0, H);
  for (let x = 0; x <= W; x += 8) c.lineTo(x, y0 - amp * fbm(x * freq + off, 5));
  c.lineTo(W, H); c.closePath(); c.fillStyle = col; c.fill();
  if (rim) { c.strokeStyle = rim; c.lineWidth = 2; c.beginPath(); for (let x = 0; x <= W; x += 8) { const y = y0 - amp * fbm(x * freq + off, 5); x ? c.lineTo(x, y) : c.moveTo(x, y); } c.stroke(); }
}
function flame(c, x, y, s, t, seed) {
  c.save(); c.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 14; i++) {
    const life = ((t * 1.6 + i / 14 + seed) % 1), ph = i * 12.3 + seed * 50;
    const px = x + n1(ph + t * 3) * s * .25 * life, py = y - life * s * 1.3;
    const sz = s * (1 - life) * .9;
    glow(c, life < .3 ? SP.gold : SP.fire, px, py, sz, (1 - life) * .7);
  }
  glow(c, SP.fire, x, y - s * .3, s * 5, .25 + .08 * n1(t * 8 + seed));
  c.restore();
}

/* =====================================================================
   SCENES
   ===================================================================== */
/* ---- 0 · Intro ---- */
const INTRO_N = 1100, INTRO_T = star8Points(INTRO_N, 190);
const INTRO_P = INTRO_T.map(() => ({ x: (R() - .5) * W * 1.4, y: (R() - .5) * H * 1.4, d: R() * .9, s: R() * 2 + 1 }));
function sceneIntro(c, lt, d) {
  const cx = W / 2, cy = H * .44;
  const bg = c.createRadialGradient(cx, cy, 0, cx, cy, W * .7);
  bg.addColorStop(0, '#1c1408'); bg.addColorStop(.5, '#08070b'); bg.addColorStop(1, '#000');
  c.fillStyle = bg; c.fillRect(0, 0, W, H);
  drawStars(c, lt, .35 * ss(0, 2, lt));
  pattern(c, cx, cy, -lt * .02, .07 * ss(2.5, 5, lt));
  // god rays
  c.save(); c.globalCompositeOperation = 'lighter'; c.translate(cx, cy); c.rotate(lt * .05);
  const ra = ss(2.8, 4.5, lt) * .12;
  for (let i = 0; i < 24; i++) {
    c.rotate(TAU / 24); const g = c.createLinearGradient(0, 0, 900, 0);
    g.addColorStop(0, `rgba(255,200,110,${ra * (.5 + .5 * Math.sin(i * 2.7 + lt))})`); g.addColorStop(1, 'rgba(255,200,110,0)');
    c.fillStyle = g; c.beginPath(); c.moveTo(0, 0); c.lineTo(900, -30); c.lineTo(900, 30); c.closePath(); c.fill();
  }
  c.restore();
  // particles converge into the star
  const rot = lt * .08;
  c.save(); c.globalCompositeOperation = 'lighter';
  const cr = Math.cos(rot), sr = Math.sin(rot);
  for (let i = 0; i < INTRO_N; i++) {
    const p = INTRO_P[i], tg = INTRO_T[i];
    const k = eInOut((lt - .3 - p.d) / 2.6);
    const sw = (1 - k) * 2.4, cs = Math.cos(sw), sn = Math.sin(sw);
    let x = lerp(p.x, tg[0], k), y = lerp(p.y, tg[1], k);
    const x2 = x * cs - y * sn, y2 = x * sn + y * cs;
    const fx = cx + x2 * cr - y2 * sr, fy = cy + x2 * sr + y2 * cr;
    glow(c, SP.gold, fx, fy, p.s * 6 + (1 - k) * 8, .5 * ss(0, .8, lt) * (k > .98 ? .6 : 1));
  }
  c.restore();
  // solid emblem
  const ea = ss(3.0, 4.0, lt);
  if (ea > 0) {
    c.save(); c.globalAlpha = ea; c.shadowColor = 'rgba(255,190,90,.9)'; c.shadowBlur = 30;
    c.strokeStyle = '#f3cf86'; c.lineWidth = 3; star8(c, cx, cy, 190, rot); c.stroke();
    c.lineWidth = 1.5; star8(c, cx, cy, 150, -rot * 1.5); c.stroke();
    c.beginPath(); c.arc(cx, cy, 118, 0, TAU); c.stroke();
    c.beginPath(); c.arc(cx, cy, 232, 0, TAU * ss(3, 4.6, lt)); c.stroke();
    c.restore();
  }
}

/* ---- 1 · Egypt / Pharaoh ---- */
const DUST = Array.from({ length: 260 }, () => ({ x: R() * W, y: R() * H, s: R() * 3 + .5, v: R() * 120 + 40, p: R() * TAU }));
function sceneEgypt(c, lt, d) {
  const pan = -lt * 16;
  const sky = c.createLinearGradient(0, 0, 0, H * .7);
  sky.addColorStop(0, '#0d0309'); sky.addColorStop(.45, '#3e0a14'); sky.addColorStop(.8, '#8f2a17'); sky.addColorStop(1, '#d4581f');
  c.fillStyle = sky; c.fillRect(0, 0, W, H);
  drawStars(c, lt, .45, H * .5, pan * .05);
  // moon
  const mx = W * .74 + pan * .1, my = 250;
  c.save(); c.globalCompositeOperation = 'lighter';
  const halo = c.createRadialGradient(mx, my, 60, mx, my, 520); halo.addColorStop(0, 'rgba(255,170,110,.35)'); halo.addColorStop(1, 'rgba(255,120,60,0)');
  c.fillStyle = halo; c.fillRect(0, 0, W, H); c.restore();
  const mg = c.createRadialGradient(mx - 30, my - 30, 10, mx, my, 115); mg.addColorStop(0, '#fff1d6'); mg.addColorStop(1, '#f2a46a');
  c.fillStyle = mg; c.beginPath(); c.arc(mx, my, 115, 0, TAU); c.fill();
  c.fillStyle = 'rgba(160,70,50,.18)'; [[-38, -8, 26], [30, 32, 18], [44, -40, 11], [-10, 55, 8], [5, -60, 7]].forEach(([a, b, r]) => { c.beginPath(); c.arc(mx + a, my + b, r, 0, TAU); c.fill(); });
  // haze
  const hz = c.createLinearGradient(0, H * .5, 0, H * .72); hz.addColorStop(0, 'rgba(255,120,60,0)'); hz.addColorStop(1, 'rgba(255,140,70,.35)');
  c.fillStyle = hz; c.fillRect(0, H * .45, W, H * .3);
  // pyramids
  const base = H * .70;
  [[W * .18, 330, .2], [W * .42, 430, .2], [W * .62, 260, .2], [W * 1.02, 300, .2]].forEach(([x0, h, par]) => {
    const x = x0 + pan * par, hw = h * .95;
    c.fillStyle = '#5a1a12'; c.beginPath(); c.moveTo(x - hw, base); c.lineTo(x, base - h); c.lineTo(x + hw, base); c.fill();
    c.fillStyle = '#8c3519'; c.beginPath(); c.moveTo(x, base - h); c.lineTo(x + hw, base); c.lineTo(x + hw * .25, base); c.fill();

/* ---- 3 · Flight to Madyan ---- */
function duneY(x, k, pan) { const L = [[H * .64, 60, .0016, 11], [H * .70, 80, .0013, 23], [H * .79, 90, .0011, 37], [H * .90, 70, .0009, 51]][k]; return L[0] - L[1] * fbm((x - pan * (0.15 + k * .3)) * L[2] + L[3], 5); }

  c.restore();
  c.fillStyle = '#fff2c4'; c.beginPath(); c.arc(sxp, syp, 95, 0, TAU); c.fill();
  // birds

      c.beginPath(); c.ellipse(ax + 8, ay - 150, 120, 26, 0, 0, TAU); c.fill();
      const wx = 520, wy = duneY(wx, 1, pan) + 4;
      c.fillRect(wx - 34, wy - 40, 68, 42); c.lineWidth = 5; c.beginPath(); c.moveTo(wx - 30, wy - 40); c.lineTo(wx - 30, wy - 100); c.lineTo(wx + 30, wy - 100); c.lineTo(wx + 30, wy - 40); c.stroke();

/* ---- 4 · Mount Tur, the fire ---- */

function sceneTur(c, lt, d) {
  const fx = W * .6, fy = H * .58;
  const z = 1 + eInOut(lt / d) * .22;

  const sky = c.createLinearGradient(0, 0, 0, H * .7); sky.addColorStop(0, '#010208'); sky.addColorStop(1, '#0b1630');

  const mg = c.createLinearGradient(0, H * .25, 0, H); mg.addColorStop(0, '#0d1222'); mg.addColorStop(1, '#020309'); c.fillStyle = mg; c.fill();
  // light on the mountain from the fire

  c.save(); c.globalCompositeOperation = 'lighter';
  glow(c, SP.fire, fx, fy, 900 + call * 1400, .35 + call * .35);
  c.restore();
  // bush
  c.strokeStyle = '#0a0503'; c.lineWidth = 4; c.lineCap = 'round';
  for (let i = 0; i < 9; i++) { const an = -Math.PI / 2 + (i - 4) * .3; c.beginPath(); c.moveTo(fx, fy + 30); c.quadraticCurveTo(fx + Math.cos(an) * 30, fy + Math.sin(an) * 30, fx + Math.cos(an) * 70, fy + 30 + Math.sin(an) * 80); c.stroke(); }
  // fire (grows), stays pure light — the bush is not consumed

  c.restore();
  c.restore();

/* ---- 5 · The staff and the sorcerers ---- */
const HZ = H * .4, FOC = 820, CAMH = 190;
const proj = (x, z, y = 0) => [W / 2 + x * FOC / z, HZ + (CAMH - y) * FOC / z, FOC / z];
const ROPES = Array.from({ length: 10 }, (_, i) => {
  const a = (i / 10) * TAU + .3, r = 260 + (i % 3) * 120;
  return { x: Math.cos(a) * r * 1.4, z: 900 + Math.sin(a) * r, dir: R() * TAU, len: 160 + R() * 120, f: 2 + R() * 2, sp: 2 + R() * 3, ph: R() * 10 };
});
// serpent path passes through ropes in an angular order
const SNAKE_PTS = [[0, 620], ...ROPES.map(r => [r.x, r.z]).sort((a, b) => Math.atan2(a[1] - 900, a[0]) - Math.atan2(b[1] - 900, b[0])), [0, 900], [0, 760]];

}
const CROWD = Array.from({ length: 420 }, (_, i) => ({ row: i % 7, u: R(), p: R() * TAU }));
function sceneStaff(c, lt, d) {
  const sky = c.createLinearGradient(0, 0, 0, HZ); sky.addColorStop(0, '#07030c'); sky.addColorStop(1, '#3a1430');
  c.fillStyle = sky; c.fillRect(0, 0, W, HZ + 2);

  c.fillStyle = fl; c.fillRect(0, HZ, W, H - HZ);

  for (let i = -20; i <= 20; i++) { const a = proj(i * 120, 6000), b = proj(i * 120, 120); c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.stroke(); }

  const pc = proj(0, 620);

  for (const r of ROPES) {

    if (eaten >= 1) {

      const et = lt - r.eat; if (et < 2) { c.save(); c.globalCompositeOperation = 'lighter'; for (let k = 0; k < 18; k++) { const an = k * 2.4, rr = et * 120 * (1 + k % 3 * .3); const p = proj(r.x + Math.cos(an) * rr, r.z + Math.sin(an) * rr * .5, et * 90 * (k % 4)); glow(c, SP.gold, p[0], p[1], 30 * p[2], (1 - et / 2) * .8); } c.restore(); }

    }

/* ---- 6 · The parting of the sea ---- */
const SHZ = H * .46, SF = 900, SCH = 150;

function sceneSea(c, lt, d) {

}

/* ---- 7 · Outro / dawn ---- */
function sceneOutro(c, lt, d) {
  const hy = H * .62, rise = eOut(lt / 8);

  sky.addColorStop(0, '#0b1030'); sky.addColorStop(.45, '#5b3a6a'); sky.addColorStop(.8, '#ff9a5a'); sky.addColorStop(1, '#ffe0a0');
  c.fillStyle = sky; c.fillRect(0, 0, W, H);

  c.save(); c.beginPath(); c.rect(0, 0, W, hy); c.clip(); c.fillStyle = '#fff6dc'; c.beginPath(); c.arc(sx0, sy0, 100, 0, TAU); c.fill(); c.restore();

  c.fillStyle = sea; c.fillRect(0, hy, W, H - hy);
  c.save(); c.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 70; i++) { const k = i / 70, y = hy + (H - hy) * k * k, rw = 40 + k * 500, n = n1(i * 2.3 + lt * 1.8); c.fillStyle = `rgba(255,220,160,${.4 * (1 - k * .5) * (.5 + .5 * n)})`; c.fillRect(sx0 - rw / 2 + n * 40 * k, y, rw * (.5 + .5 * Math.abs(n)), 1.5 + k * 4); }
  c.restore();
  c.strokeStyle = '#3a1e30'; c.lineWidth = 3;
  for (let i = 0; i < 9; i++) { const bx = W * .2 + lt * 60 + i * 50 + Math.sin(i * 2) * 40, by = 300 + Math.sin(i * 3.3) * 60 - lt * 6, fl = Math.sin(lt * 8 + i * 1.3) * 9; c.beginPath(); c.moveTo(bx - 16, by - fl); c.quadraticCurveTo(bx - 7, by - 4, bx, by); c.quadraticCurveTo(bx + 7, by - 4, bx + 16, by - fl); c.stroke(); }

    c.save(); c.globalAlpha = ea * .85; c.fillStyle = '#000'; c.fillRect(0, 0, W, H); c.restore();
    c.save(); c.globalAlpha = ea; c.strokeStyle = '#f3cf86'; c.lineWidth = 2.5; c.shadowColor = 'rgba(255,190,90,.9)'; c.shadowBlur = 24;
    star8(c, W / 2, H * .42, 110, lt * .1); c.stroke(); c.beginPath(); c.arc(W / 2, H * .42, 136, 0, TAU); c.stroke(); c.restore();

const SCENES = [
  { s: 0, e: 9, f: sceneIntro },
  { s: 8, e: 22, f: sceneEgypt },
  { s: 21, e: 34, f: sceneNile },
  { s: 33, e: 45, f: sceneMadyan },
  { s: 44, e: 58, f: sceneTur },
  { s: 57, e: 72, f: sceneStaff },
  { s: 71, e: 88, f: sceneSea },
  { s: 87, e: 100, f: sceneOutro },

const XF = 1.0;

/* ---------- post-processing ---------- */
const VIG = mk(); { const x = VIG.getContext('2d'); const g = x.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, W * .62); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.72)'); x.fillStyle = g; x.fillRect(0, 0, W, H); }
const GRAIN = Array.from({ length: 6 }, (_, k) => { const c = mk(480, 270), x = c.getContext('2d'), id = x.createImageData(480, 270), r = rng(77 + k); for (let i = 0; i < id.data.length; i += 4) { const v = r() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; } x.putImageData(id, 0, 0); return c; });
const LEAK = SCENES.slice(1).map(s => s.s + .5);

  if (fade > 0) { c.globalAlpha = fade; c.fillRect(0, 0, W, H); }
  c.restore();
}

function renderAt(t) {

  for (const sc of SCENES) {
    if (t < sc.s || t > sc.e) continue;
    const a = sc.s > 0 ? ss(sc.s, sc.s + XF, t) : 1;
    bctx.setTransform(1, 0, 0, 1, 0, 0); bctx.globalAlpha = 1; bctx.globalCompositeOperation = 'source-over'; bctx.shadowBlur = 0;
    bctx.clearRect(0, 0, W, H);
    bctx.save(); sc.f(bctx, t - sc.s, sc.e - sc.s, t); bctx.restore();
    ctx.globalAlpha = a; ctx.drawImage(buf, 0, 0); ctx.globalAlpha = 1;
  }
  post(ctx, t);
}

/* ---------- boot / player ---------- */
const params = new URLSearchParams(location.search);
async function boot() {
  await Promise.all(['700 60px Amiri', '400 60px Amiri', '700 30px ReemKufi', '700 60px Ruqaa'].map(f => document.fonts.load(f, 'مرحبا')));
  await document.fonts.ready;
  window.renderAt = renderAt; window.DUR = DUR; window.FPS = FPS;
  window.frameJPEG = (t, q = .93) => { renderAt(t); return cv.toDataURL('image/jpeg', q); };
  if (params.has('render')) { document.body.classList.add('render'); window.READY = true; return; }
  const aud = document.getElementById('aud'), btn = document.getElementById('play'), seek = document.getElementById('seek'), tm = document.getElementById('tm');
  let playing = false, t0 = 0, base = 0, cur = params.has('t') ? +params.get('t') : 0;
  const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  btn.onclick = () => { playing = !playing; btn.textContent = playing ? '❚❚ إيقاف' : '▶ تشغيل'; if (playing) { t0 = performance.now(); base = cur; aud.currentTime = cur; aud.play().catch(() => {}); } else aud.pause(); };
  seek.oninput = () => { cur = +seek.value; base = cur; t0 = performance.now(); aud.currentTime = cur; };
  (function loop() {
    if (playing) { cur = base + (performance.now() - t0) / 1000; if (cur >= DUR) { cur = DUR; playing = false; btn.textContent = '▶ تشغيل'; aud.pause(); } }
    renderAt(cur); seek.value = cur; tm.textContent = fmt(cur); requestAnimationFrame(loop);
  })();
  window.READY = true;
}
boot();
