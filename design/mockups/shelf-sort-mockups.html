<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Trivanquil — تصاميم الشاشات</title>
<style>
@font-face { font-family: "Cairo"; src: url("fonts/Cairo.ttf"); font-weight: 200 1000; }
@font-face { font-family: "Lalezar"; src: url("fonts/Lalezar-Regular.ttf"); }
@font-face { font-family: "Noto Sans Devanagari"; src: url("fonts/NotoSansDevanagari.ttf"); font-weight: 100 900; }
@font-face { font-family: "Noto Sans Bengali"; src: url("fonts/NotoSansBengali.ttf"); font-weight: 100 900; }
@font-face { font-family: "Noto Sans Telugu"; src: url("fonts/NotoSansTelugu.ttf"); font-weight: 100 900; }

:root {
  --teal: #13a89e; --teal-d: #0b6e69; --teal-dd: #08403e;
  --orange: #ff8a3d; --orange-d: #e0631b;
  --yellow: #ffd23f; --cream: #fff6e5; --cream-d: #f4e3c3;
  --wood: #c98a4b; --wood-d: #8f5a2c; --wood-l: #e2ae73;
  --pink: #ff6b8b; --purple: #7b5cff; --green: #3cc46b; --red: #ff4d5e;
  --ink: #2b2140;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Cairo", sans-serif; background: #1d1630; color: var(--ink); padding: 48px; }
.emoji { font-family: "Noto Color Emoji"; font-style: normal; line-height: 1; }

/* ---------- overview page ---------- */
.page-head { text-align: center; color: #fff; margin-bottom: 40px; }
.page-head h1 { font-family: "Lalezar"; font-size: 64px; font-weight: 400; color: var(--yellow); }
.page-head p { font-size: 22px; opacity: .8; }
.grid { display: grid; grid-template-columns: repeat(4, 390px); gap: 48px 40px; justify-content: center; }
.cell figcaption { color: #fff; text-align: center; margin-top: 14px; font-size: 20px; font-weight: 700; }
.cell figcaption span { display: block; font-size: 15px; font-weight: 400; opacity: .7; }

/* ---------- phone ---------- */
.phone { width: 390px; height: 844px; border-radius: 44px; overflow: hidden; position: relative;
  box-shadow: 0 0 0 10px #0d0a17, 0 30px 60px rgba(0,0,0,.5); }
.bg-shop { background: radial-gradient(circle at 50% 0%, #4fd6c9 0%, var(--teal) 40%, var(--teal-d) 100%); }
.bg-wall { background:
  repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 26px, transparent 26px 52px),
  linear-gradient(180deg, #ffe9c7 0%, #ffd9a0 100%); }

/* HUD */
.hud { position: absolute; top: 0; left: 0; right: 0; padding: 52px 18px 0; display: flex; gap: 8px; align-items: center; z-index: 5; }
.pill { display: flex; align-items: center; gap: 6px; background: rgba(8,64,62,.55); color: #fff; border-radius: 30px;
  padding: 3px 4px 3px 12px; font-weight: 800; font-size: 16px; border: 2px solid rgba(255,255,255,.25); }
.pill .emoji { font-size: 20px; }
.pill .plus { width: 24px; height: 24px; border-radius: 50%; background: var(--green); display: grid; place-items: center;
  font-weight: 900; font-size: 18px; line-height: 1; box-shadow: inset 0 -3px 0 rgba(0,0,0,.2); }
.pill.dark { background: rgba(43,33,64,.75); }
.spacer { flex: 1; }
.icon-btn { width: 44px; height: 44px; border-radius: 14px; background: #fff; display: grid; place-items: center;
  box-shadow: 0 4px 0 #d9c7a5; font-size: 22px; }

/* buttons */
.btn { display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: 22px; font-weight: 900;
  color: #fff; font-size: 24px; height: 68px; text-shadow: 0 2px 0 rgba(0,0,0,.18); }
.btn-green { background: linear-gradient(180deg, #5be08a, var(--green)); box-shadow: 0 6px 0 #22924a, 0 12px 20px rgba(0,0,0,.25); }
.btn-orange { background: linear-gradient(180deg, #ffad6b, var(--orange)); box-shadow: 0 6px 0 var(--orange-d), 0 12px 20px rgba(0,0,0,.2); }
.btn-purple { background: linear-gradient(180deg, #9c86ff, var(--purple)); box-shadow: 0 6px 0 #5134d4, 0 12px 20px rgba(0,0,0,.2); }
.btn small { font-size: 15px; font-weight: 700; opacity: .95; }
.ad-tag { background: rgba(255,255,255,.25); border-radius: 8px; padding: 0 8px; font-size: 14px; }

/* ---------- 1 splash ---------- */
.splash { display: flex; flex-direction: column; align-items: center; padding-top: 150px; text-align: center; }
.sun { position: absolute; inset: -200px; background: repeating-conic-gradient(rgba(255,255,255,.07) 0 10deg, transparent 10deg 20deg); }
.logo { position: relative; font-family: "Lalezar"; font-size: 92px; line-height: 1.05; color: var(--yellow);
  -webkit-text-stroke: 4px var(--teal-dd); paint-order: stroke fill; text-shadow: 0 8px 0 var(--teal-dd), 0 16px 30px rgba(0,0,0,.35); transform: rotate(-3deg); }
.logo-en { position: relative; margin-top: 14px; background: var(--orange); color: #fff; font-weight: 900; letter-spacing: 6px;
  padding: 4px 22px; border-radius: 30px; font-size: 20px; box-shadow: 0 5px 0 var(--orange-d); direction: ltr; }
.hero-shelf { position: relative; margin-top: 70px; }
.splash .tagline { position: relative; color: #fff; font-weight: 700; font-size: 20px; margin-top: 60px; }
.splash .loader { margin-top: 26px; }
.loader { position: relative; width: 250px; height: 22px; border-radius: 20px; background: rgba(0,0,0,.25); margin-top: 18px; padding: 4px; }
.loader i { display: block; width: 68%; height: 100%; border-radius: 20px; background: linear-gradient(90deg, var(--yellow), var(--orange)); }
.splash .ver { position: absolute; bottom: 26px; color: rgba(255,255,255,.6); font-size: 14px; }

/* shelf (shared) */
.shelf { position: relative; width: 112px; height: 98px; background: linear-gradient(180deg, #7a4a22, #5e3816);
  border-radius: 12px; padding: 6px 6px 0; box-shadow: inset 0 0 0 3px #4a2b10, 0 6px 10px rgba(0,0,0,.25); }
.shelf::after { content: ""; position: absolute; left: -4px; right: -4px; bottom: -6px; height: 18px; border-radius: 6px;
  background: linear-gradient(180deg, var(--wood-l), var(--wood)); box-shadow: 0 4px 0 var(--wood-d); }
.shelf .back { position: absolute; top: 8px; left: 0; right: 0; display: flex; justify-content: space-around; opacity: .4; filter: grayscale(.3) brightness(.6); }
.shelf .back .emoji { font-size: 22px; }
.shelf .front { position: absolute; bottom: 12px; left: 0; right: 0; display: flex; justify-content: space-around; align-items: flex-end; z-index: 2; }
.shelf .front .emoji { font-size: 34px; filter: drop-shadow(0 3px 2px rgba(0,0,0,.35)); }
.shelf .slot-empty { width: 30px; }
.shelf.glow { box-shadow: inset 0 0 0 3px #4a2b10, 0 0 0 4px var(--yellow), 0 0 26px 8px rgba(255,210,63,.8); }
.shelf .pop { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); background: var(--yellow); color: var(--ink);
  font-weight: 900; font-size: 15px; border-radius: 12px; padding: 0 10px; z-index: 4; box-shadow: 0 3px 0 #d6a800; white-space: nowrap; }
.shelf .lock { position: absolute; inset: 0; border-radius: 12px; background: rgba(0,0,0,.45); display: grid; place-items: center; z-index: 3; }
.shelf .lock .emoji { font-size: 28px; }
.shelf .lock b { position: absolute; bottom: 20px; color: #fff; font-size: 13px; }

/* ---------- 2 home ---------- */
.home { background: linear-gradient(180deg, #8fe3ff 0%, #c9f1ff 45%, #a8e07a 45.1%, #7cc85a 100%); }
.cloud { position: absolute; background: #fff; border-radius: 50px; opacity: .9; }
.store-front { position: absolute; top: 200px; left: 40px; width: 310px; }
.store-roof { height: 26px; background: var(--teal-d); border-radius: 10px 10px 0 0; }
.awning { height: 52px; background: repeating-linear-gradient(90deg, var(--red) 0 31px, #fff 31px 62px);
  border-radius: 0 0 22px 22px; box-shadow: 0 8px 0 rgba(0,0,0,.12); position: relative; z-index: 2;
  -webkit-mask: radial-gradient(circle 16px at 15.5px 52px, transparent 15px, #000 16px) repeat-x; -webkit-mask-size: 31px 100%; }
.store-body { background: var(--cream); margin: 0 10px; height: 200px; position: relative; border: 4px solid var(--cream-d); border-top: 0; }
.store-sign { position: absolute; top: -104px; left: 50%; transform: translateX(-50%); background: var(--wood); color: #fff;
  font-weight: 900; font-size: 22px; padding: 2px 24px; border-radius: 12px; border: 3px solid var(--wood-d); white-space: nowrap; z-index: 3; }
.win-l, .win-r { position: absolute; top: 24px; width: 110px; height: 100px; background: #bfeeff; border: 6px solid var(--wood);
  border-radius: 8px; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 2px; }
.win-l { right: 14px; } .win-r { left: 14px; }
.win-l .emoji, .win-r .emoji { font-size: 26px; }
.door { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 56px; height: 120px; background: var(--wood-d); border-radius: 28px 28px 0 0; border: 4px solid var(--wood); }
.scaffold { position: absolute; top: 150px; left: 22px; font-size: 40px; z-index: 4; }
.reno-badge { position: absolute; top: 480px; left: 50%; transform: translateX(-50%); width: 300px; background: #fff; border-radius: 20px;
  padding: 12px 16px; box-shadow: 0 6px 0 #d8ccb2; }
.reno-badge .row { display: flex; justify-content: space-between; font-weight: 800; font-size: 16px; }
.bar { height: 16px; background: #eee3cf; border-radius: 10px; margin-top: 8px; overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--yellow), var(--orange)); border-radius: 10px; }
.side-widgets { position: absolute; top: 120px; display: flex; flex-direction: column; gap: 14px; z-index: 6; }
.side-widgets.r { right: 14px; } .side-widgets.l { left: 14px; }
.widget { width: 64px; text-align: center; }
.widget .ic { width: 60px; height: 60px; border-radius: 18px; background: #fff; display: grid; place-items: center; margin: 0 auto;
  box-shadow: 0 5px 0 #c7b994; position: relative; }
.widget .ic .emoji { font-size: 32px; }
.widget b { display: block; font-size: 13px; color: var(--ink); background: rgba(255,255,255,.85); border-radius: 8px; margin-top: 4px; }
.dot { position: absolute; top: -5px; left: -5px; min-width: 22px; height: 22px; border-radius: 11px; background: var(--red); color: #fff;
  font-size: 13px; font-weight: 900; display: grid; place-items: center; padding: 0 5px; border: 2px solid #fff; }
.play-wrap { position: absolute; bottom: 120px; left: 40px; right: 40px; }
.play-wrap .btn { height: 84px; font-size: 32px; }
.play-wrap .btn small { display: block; font-size: 16px; }
.nav { position: absolute; bottom: 0; left: 0; right: 0; height: 96px; background: var(--teal-dd); display: flex; padding: 8px 10px 20px;
  border-top: 4px solid var(--teal-d); }
.nav a { flex: 1; text-align: center; color: rgba(255,255,255,.7); font-size: 13px; font-weight: 700; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px; border-radius: 16px; }
.nav a .emoji { font-size: 28px; }
.nav a.on { background: var(--teal); color: #fff; transform: translateY(-14px); box-shadow: 0 6px 0 var(--teal-d); }

/* ---------- 3 map ---------- */
.map { background: linear-gradient(180deg, #a3e3ff, #d4f4c4 30%, #9ad97a); }
.map-title { position: absolute; top: 108px; left: 0; right: 0; text-align: center; }
.map-title h2 { display: inline-block; background: #fff; border-radius: 18px; padding: 2px 22px; font-size: 22px; box-shadow: 0 5px 0 #c7b994; }
.path { position: absolute; inset: 0; }
.node { position: absolute; width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 22px; color: #fff; }
.node.done { background: linear-gradient(180deg, #ffd96b, #f2b200); box-shadow: 0 5px 0 #b98700; }
.node.done::after { content: "★★★"; position: absolute; top: -18px; font-size: 13px; color: var(--yellow); -webkit-text-stroke: 1px #b98700; letter-spacing: -1px; }
.node.cur { width: 76px; height: 76px; font-size: 28px; background: linear-gradient(180deg, #5be08a, var(--green)); box-shadow: 0 6px 0 #22924a, 0 0 0 8px rgba(255,255,255,.6); }
.node.hard { background: linear-gradient(180deg, #ff8fa6, var(--red)); box-shadow: 0 5px 0 #c42537; }
.node.hard::before { content: "صعبة"; position: absolute; bottom: -24px; font-size: 13px; background: var(--red); padding: 0 8px; border-radius: 8px; }
.node.lock { background: #c9c3b6; box-shadow: 0 5px 0 #9c9586; color: #8a8375; }
.avatar { position: absolute; font-size: 46px; }
.milestone { position: absolute; width: 150px; background: #fff; border-radius: 18px; padding: 8px; text-align: center; box-shadow: 0 6px 0 #c7b994; }
.milestone .emoji { font-size: 40px; }
.milestone b { display: block; font-size: 16px; }
.milestone span { font-size: 12px; color: #7a6f5c; }
.milestone.locked { filter: grayscale(1); opacity: .85; }

/* ---------- 4 gameplay ---------- */
.game-hud { position: absolute; top: 48px; left: 14px; right: 14px; display: flex; align-items: center; gap: 10px; }
.timer { position: absolute; top: 30px; left: 50%; transform: translateX(-50%); z-index: 7; text-align: center; }
.timer .ring { width: 112px; height: 112px; border-radius: 50%; display: grid; place-items: center;
  background: conic-gradient(from 0deg, #ff4d5e 0 20%, #f1dcc0 20% 100%);
  box-shadow: 0 0 0 5px #fff, 0 7px 0 5px #e8b48e, 0 0 34px 12px rgba(255,77,94,.55); }
.timer .inner { width: 86px; height: 86px; border-radius: 50%; background: radial-gradient(circle at 50% 30%, #fff, #ffeaea);
  display: flex; flex-direction: column; align-items: center; justify-content: center; }
.timer .inner .emoji { font-size: 22px; transform: rotate(-12deg); }
.timer .inner strong { font-size: 34px; font-weight: 900; color: var(--red); line-height: 1; direction: ltr; text-shadow: 0 2px 0 #ffc2c8; }
.timer .hurry { display: inline-block; margin-top: -12px; position: relative; background: linear-gradient(180deg, #ff8fa0, var(--red)); color: #fff;
  font-weight: 900; font-size: 17px; padding: 2px 16px; border-radius: 14px; box-shadow: 0 4px 0 #b8202f; transform: rotate(-4deg); white-space: nowrap; }
.timer .tick { position: absolute; top: 4px; font-size: 18px; font-weight: 900; color: var(--red); }
.timer .tick.a { left: -12px; transform: rotate(-25deg); } .timer .tick.b { right: -12px; transform: rotate(25deg); }
.shelf.drop { box-shadow: inset 0 0 0 3px #4a2b10, 0 0 0 4px #5be08a, 0 0 24px 8px rgba(91,224,138,.75); }
.shelf.drop .front { justify-content: space-around; }
.shelf.drop .ghost-slot { width: 30px; height: 34px; border: 3px dashed rgba(255,255,255,.8); border-radius: 10px; }
.shelf.drop .ghost-slot.hl { background: rgba(91,224,138,.35); border-color: #fff; transform: scale(1.15); }
.drop-chip { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 4; background: #fff; color: var(--green); font-weight: 900;
  font-size: 13px; border-radius: 12px; padding: 0 10px; box-shadow: 0 3px 0 #22924a; white-space: nowrap; }
.guide { position: absolute; inset: 0; z-index: 8; pointer-events: none; }
.trail { position: absolute; z-index: 8; font-size: 12px; color: #fff; }
.timer .star-mark { position: absolute; z-index: 2; width: 30px; height: 30px; border-radius: 50%; background: var(--yellow); display: grid; place-items: center;
  font-size: 18px; color: #fff; -webkit-text-stroke: 1px #c99700; box-shadow: 0 0 0 3px #fff, 0 3px 0 3px #c99700; }
.timer .star-mark small { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); font-size: 11px; font-weight: 900; color: var(--red);
  -webkit-text-stroke: 0; background: #fff; border-radius: 8px; padding: 0 5px; white-space: nowrap; direction: ltr; }
.combo-bonus { display: block; font-size: 11px; font-weight: 900; color: var(--green); margin-top: -2px; }
.booster.suggest .ic { box-shadow: 0 6px 0 #6fb6e8, 0 0 0 4px #9fdcff, 0 0 26px 8px rgba(120,200,255,.9); background: linear-gradient(180deg, #fff, #e3f4ff); }
.booster .hint { position: absolute; top: -34px; left: 50%; transform: translateX(-50%); background: #2f8fd8; color: #fff; font-size: 12px; font-weight: 900;
  border-radius: 10px; padding: 1px 8px; white-space: nowrap; box-shadow: 0 3px 0 #1d6aa6; }
.booster .hint::after { content: ""; position: absolute; bottom: -6px; left: 50%; margin-left: -6px; border: 6px solid transparent; border-bottom: 0; border-top-color: #2f8fd8; }
.urgent { position: absolute; inset: 0; pointer-events: none; z-index: 4; box-shadow: inset 0 0 70px 14px rgba(255,77,94,.45); border-radius: 44px; }
.goal .lose { color: var(--red); font-size: 13px; }
.goal .lose b { direction: ltr; display: inline-block; }
.lvl { flex: 1; text-align: center; }
.lvl b { display: inline-block; background: var(--teal-dd); color: #fff; padding: 2px 18px; border-radius: 14px; font-size: 18px; }
.stat { background: #fff; border-radius: 16px; padding: 4px 12px; text-align: center; box-shadow: 0 4px 0 #d9c7a5; min-width: 78px; }
.stat small { display: block; font-size: 11px; color: #8a7a5c; font-weight: 700; }
.stat strong { font-size: 22px; line-height: 1.1; }
.goal { position: absolute; top: 174px; left: 30px; right: 30px; background: rgba(255,255,255,.9); border-radius: 16px; padding: 8px 14px; }
.goal .row { display: flex; justify-content: space-between; font-weight: 800; font-size: 14px; }
.goal .stars-mini { color: var(--yellow); -webkit-text-stroke: 1px #c99700; letter-spacing: 2px; }
.board { position: absolute; top: 240px; left: 0; right: 0; display: grid; grid-template-columns: repeat(3, 112px); gap: 18px 12px; justify-content: center; }
.dragging { position: absolute; z-index: 9; font-size: 52px; transform: rotate(-12deg) scale(1.1); filter: drop-shadow(0 14px 8px rgba(0,0,0,.35)); }
.hand { position: absolute; z-index: 10; font-size: 46px; }
.combo { position: absolute; top: 160px; left: 22px; z-index: 8; font-family: "Lalezar"; font-size: 34px; color: var(--yellow);
  -webkit-text-stroke: 2px var(--orange-d); paint-order: stroke fill; transform: rotate(-10deg); text-shadow: 0 4px 0 var(--orange-d); }
.boosters { position: absolute; bottom: 30px; left: 20px; right: 20px; display: flex; justify-content: space-around; }
.booster { text-align: center; position: relative; }
.booster .ic { width: 78px; height: 78px; border-radius: 24px; background: linear-gradient(180deg, #fff, #f3ead9); display: grid; place-items: center;
  box-shadow: 0 6px 0 #c9b48c, 0 10px 18px rgba(0,0,0,.18); }
.booster .ic .emoji { font-size: 38px; }
.booster b { display: block; margin-top: 8px; font-size: 14px; }
.booster .cnt { position: absolute; top: -6px; left: -4px; width: 28px; height: 28px; border-radius: 50%; background: var(--purple); color: #fff;
  font-weight: 900; font-size: 15px; display: grid; place-items: center; border: 3px solid #fff; }
.booster .cnt.add { background: var(--green); }

/* ---------- overlays ---------- */
.dim { position: absolute; inset: 0; background: rgba(8,40,50,.35); z-index: 20; }
.card { position: absolute; left: 24px; right: 24px; z-index: 21; background: var(--cream); border-radius: 30px; padding: 70px 22px 24px;
  text-align: center; border: 5px solid #fff; box-shadow: 0 10px 0 var(--cream-d), 0 30px 60px rgba(0,0,0,.4); }
.ribbon { position: absolute; top: -34px; left: -18px; right: -18px; height: 72px; background: linear-gradient(180deg, #ffad6b, var(--orange));
  border-radius: 18px; display: grid; place-items: center; color: #fff; font-family: "Lalezar"; font-size: 40px;
  box-shadow: 0 6px 0 var(--orange-d); text-shadow: 0 3px 0 rgba(0,0,0,.2); }
.ribbon.red { background: linear-gradient(180deg, #ff8fa0, var(--red)); box-shadow: 0 6px 0 #b8202f; }
.big-stars { position: absolute; top: -130px; left: 0; right: 0; display: flex; justify-content: center; align-items: flex-end; gap: 4px; }
.big-stars span { font-size: 76px; color: var(--yellow); -webkit-text-stroke: 4px #c99700; paint-order: stroke fill; text-shadow: 0 6px 0 #c99700; line-height: 1; }
.big-stars span:nth-child(2) { font-size: 100px; }
.confetti { position: absolute; inset: 0; z-index: 20; pointer-events: none; }
.confetti i { position: absolute; width: 10px; height: 18px; border-radius: 3px; }
.rewards { display: flex; gap: 12px; justify-content: center; margin: 14px 0 22px; }
.reward { background: #fff; border-radius: 18px; width: 96px; padding: 10px 0; box-shadow: 0 4px 0 var(--cream-d); }
.reward .emoji { font-size: 36px; }
.reward b { display: block; font-size: 20px; margin-top: 4px; }
.card h3 { font-size: 20px; }
.card p { color: #7a6a4c; font-weight: 600; }
.card .btn { margin-top: 14px; }
.link { margin-top: 16px; color: #9a8a6c; font-weight: 700; font-size: 16px; text-decoration: underline; }
.left-items { display: flex; justify-content: center; gap: 8px; margin: 14px 0 6px; }
.left-items span { background: #fff; border-radius: 14px; padding: 6px 10px; font-weight: 800; box-shadow: 0 3px 0 var(--cream-d); }
.left-items .emoji { font-size: 26px; vertical-align: middle; }
.heart-warn { margin-top: 10px; font-size: 14px; color: var(--red); font-weight: 800; }

/* ---------- 7 renovation ---------- */
.reno { background: linear-gradient(180deg, var(--teal) 0, var(--teal-d) 100%); }
.reno-head { position: absolute; top: 104px; left: 0; right: 0; text-align: center; color: #fff; }
.reno-head h2 { font-size: 26px; }
.reno-head p { opacity: .8; font-size: 15px; }
.room { position: absolute; top: 180px; left: 20px; right: 20px; height: 200px; border-radius: 24px; overflow: hidden; border: 5px solid #fff;
  background: linear-gradient(180deg, #ffe0b5 0 62%, #d9a36b 62%); }
.room .half { position: absolute; top: 0; bottom: 0; left: 0; width: 50%; background: linear-gradient(180deg, #e7e2da 0 62%, #b5aea3 62%); filter: saturate(.3); }
