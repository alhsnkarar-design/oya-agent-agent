<title>نموذج لعبة الشحن</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&family=Lalezar&display=swap">
<style>
/* Layout: one phone-shaped game column, centered on wide screens; sky → sea → wooden quay → booster bar. */
:root {
  color-scheme: light;
  --sky1: #5fb8ea; --sky2: #cfe8f3; --sea1: #2f86ba; --sea2: #0d4473;
  --navy: #0f3368; --blue: #1f6fe0; --green: #22c25a; --gold: #ffc72c;
  --paper: #fffaf0; --paper2: #ffeec4; --edge: #d99a3a; --ink: #3d2400; --red: #ff3b30;
  --font-display: "Lalezar", "Cairo", system-ui, sans-serif;
  --font-body: "Cairo", system-ui, sans-serif;
}
html, body { height: 100%; }
body { background: #0b1a30; font-family: var(--font-body); color: #fff; overflow: hidden;
  padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }
#app { position: relative; height: 100%; max-width: 440px; margin: 0 auto; overflow: hidden; direction: rtl;
  background: linear-gradient(180deg, var(--sky1) 0%, #8fcdf0 26%, var(--sky2) 44%, #efeee6 50%); }
.view { position: absolute; inset: 0; display: flex; flex-direction: column; }
.view[hidden] { display: none !important; }
.sea { position: absolute; left: 0; right: 0; bottom: 0; top: 50%; background: linear-gradient(180deg, #5aa9cf 0%, var(--sea1) 22%, #1a6599 60%, var(--sea2)); }
.sea::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(180deg, rgba(255,255,255,.05) 0 2px, transparent 2px 9px); }
.sea::after { content: ""; position: absolute; left: -20px; right: -20px; top: -10px; height: 22px; opacity: .55;
  background: radial-gradient(ellipse 26px 12px at 26px 0, transparent 11px, rgba(255,255,255,.8) 12px 14px, transparent 15px) 0 0/52px 22px repeat-x; animation: waves 6s linear infinite; }
@keyframes waves { to { background-position: 52px 0; } }
.cloud { position: absolute; background: radial-gradient(ellipse at 50% 30%, #fff, #eef5fa 70%); border-radius: 50px; opacity: .85; filter: blur(1px); }
/* buttons */
.big { position: relative; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 64px; border-radius: 22px;
  font-family: var(--font-display); font-size: 30px; color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.25); overflow: hidden;
  background: linear-gradient(180deg, #8dff8a 0%, #35d14f 45%, #1aa83a 100%); border: 3px solid #0b7a2a;
  box-shadow: inset 0 4px 0 rgba(255,255,255,.55), 0 6px 0 #0a5f20, 0 12px 20px rgba(0,60,20,.3); }
.big::after { content: ""; position: absolute; top: 4px; left: 12px; right: 12px; height: 22px; border-radius: 16px; background: linear-gradient(180deg, rgba(255,255,255,.4), transparent); pointer-events: none; }
.big:active { transform: translateY(3px); }
.big small { font-family: var(--font-body); font-size: 14px; font-weight: 800; }
.big.blue { background: linear-gradient(180deg, #7cc8ff, #3c97ff 45%, #1f6fe0); border-color: #0e4fa3; box-shadow: inset 0 4px 0 rgba(255,255,255,.5), 0 6px 0 #0b3f82, 0 12px 20px rgba(0,30,80,.3); }
.big.orange { background: linear-gradient(180deg, #ffc27a, #ff8a2a 45%, #f06a0c); border-color: #a94400; box-shadow: inset 0 4px 0 rgba(255,255,255,.5), 0 6px 0 #8a3800, 0 12px 20px rgba(80,30,0,.3); }
.big.purple { background: linear-gradient(180deg, #c7a6ff, #8c5cff 45%, #6a3be6); border-color: #4a1fb0; box-shadow: inset 0 4px 0 rgba(255,255,255,.5), 0 6px 0 #3a1690, 0 12px 20px rgba(40,10,100,.3); font-size: 24px; }
.big.gray { filter: grayscale(.85) brightness(1.05); opacity: .8; }
.tag { font-family: var(--font-body); font-size: 12px; font-weight: 800; background: rgba(255,255,255,.28); border-radius: 10px; padding: 1px 8px; }
.round { width: 46px; height: 46px; border-radius: 15px; display: grid; place-items: center; color: #fff; flex-shrink: 0;
  background: linear-gradient(180deg, #4fb7ff, #1f7fe0); border: 2.5px solid #0e4fa3; box-shadow: inset 0 3px 0 rgba(255,255,255,.4), 0 4px 0 #0b3f82; }
.round:active { transform: translateY(2px); }
/* home */
.home-top { position: relative; z-index: 3; display: flex; justify-content: space-between; align-items: center; padding: 16px 16px 0; }
.res { height: 38px; display: flex; align-items: center; gap: 6px; padding: 0 14px; border-radius: 20px; font-weight: 900;
  background: linear-gradient(180deg, #1c4f8f, var(--navy)); border: 2.5px solid #0a2550; box-shadow: inset 0 2px 0 rgba(255,255,255,.25); }
.brand { position: relative; z-index: 3; text-align: center; margin-top: 6vh; }
.brand h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(38px, 11vw, 52px); line-height: 1.1;
  text-shadow: 0 4px 0 #0b3f82, 0 0 18px rgba(0,60,140,.35); text-wrap: balance; }
.brand p { margin: 4px 0 0; font-weight: 800; color: #0b3f82; font-size: 15px; }
.badge-test { display: inline-block; margin-top: 8px; background: #ff8a2a; color: #fff; font-weight: 900; font-size: 12px; border-radius: 10px; padding: 2px 10px; }
.home-ship { position: relative; z-index: 2; flex: 1; display: flex; align-items: flex-end; justify-content: center; padding: 0 8px; min-height: 0; }
.home-ship svg { width: 100%; max-height: 100%; }
.home-actions { position: relative; z-index: 3; display: flex; flex-direction: column; gap: 14px; padding: 18px 26px 28px; }
/* levels */
.lv-head { position: relative; z-index: 3; display: flex; align-items: center; gap: 10px; padding: 16px 16px 6px; }
.lv-head h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 30px; flex: 1; text-shadow: 0 3px 0 #0b3f82; }
.lv-grid { position: relative; z-index: 3; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 10px 16px 24px; overflow-y: auto; }
.lv { position: relative; text-align: right; border-radius: 20px; padding: 12px 14px; color: var(--ink);
  background: linear-gradient(180deg, var(--paper), var(--paper2)); border: 3px solid var(--edge); box-shadow: inset 0 3px 0 #fff, 0 5px 0 #a8701e; }
.lv:active { transform: translateY(3px); }
.lv .n { font-family: var(--font-display); font-size: 30px; line-height: 1; color: #b86b00; }
.lv b { display: block; font-size: 15px; margin-top: 2px; }
.lv span { font-size: 12px; color: #8a5a1a; font-weight: 700; }
.lv .st { position: absolute; top: 10px; left: 12px; font-size: 16px; letter-spacing: 1px; color: #ffc72c; -webkit-text-stroke: 1px #b86b00; }
.lv.locked { filter: grayscale(.9); opacity: .6; }
/* game */
.hud { position: relative; z-index: 6; display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 8px; padding: 12px 12px 0; }
.moves { width: 108px; border-radius: 22px; text-align: center; padding: 6px 0 4px;
  background: linear-gradient(180deg, #4fb7ff, #1f6fe0); border: 3px solid #0e4fa3; box-shadow: inset 0 4px 0 rgba(255,255,255,.4), 0 5px 0 #0b3f82; }
.moves small { display: block; font-weight: 900; font-size: 12px; color: #d6ecff; }
.moves b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 40px; line-height: 1; }
.moves i { display: block; font-style: normal; font-size: 11px; font-weight: 800; color: #d6ecff; }
.goalbox { justify-self: end; border-radius: 18px; padding: 6px 10px; color: var(--ink); text-align: center;
  background: linear-gradient(180deg, var(--paper), var(--paper2)); border: 3px solid var(--edge); box-shadow: inset 0 3px 0 #fff, 0 4px 0 #a8701e; }
.goalbox small { display: block; font-size: 11px; font-weight: 900; }
.ports { display: flex; gap: 4px; margin-top: 3px; }
.pt { position: relative; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-size: 12px; font-weight: 900; color: #fff; border: 2px solid rgba(0,0,0,.25); box-shadow: inset 0 2px 0 rgba(255,255,255,.4); }
.pt sup { position: absolute; top: -8px; right: -6px; background: #fff; color: var(--ink); font-size: 9px; border-radius: 6px; padding: 0 3px; line-height: 13px; }
.lvname { justify-self: start; display: flex; gap: 8px; align-items: center; }
.tilt { position: relative; z-index: 6; margin: 10px auto 0; width: min(270px, 72%); border-radius: 22px; padding: 6px 12px 4px; color: var(--ink);
  background: linear-gradient(180deg, var(--paper), var(--paper2)); border: 3px solid var(--edge); box-shadow: inset 0 3px 0 #fff, 0 4px 0 #a8701e; }
.tube { position: relative; height: 22px; border-radius: 11px; background: linear-gradient(180deg, #d8ffb0, #8fe05a); border: 2px solid #4e9a1f; box-shadow: inset 0 3px 4px rgba(0,0,0,.18); }
.tube::before { content: ""; position: absolute; inset: 0; border-radius: 11px; background: linear-gradient(90deg, #ff6b5a 0 12%, transparent 12% 88%, #ff6b5a 88%); opacity: .85; }
.tube .m { position: absolute; top: 3px; bottom: 3px; width: 2px; background: rgba(40,80,10,.6); }
.tube .b { position: absolute; top: 2px; width: 30px; height: 14px; margin-left: -15px; border-radius: 8px; background: radial-gradient(ellipse at 35% 30%, #fff, #f2ffe0 60%, #c8f09a); box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: left .35s cubic-bezier(.3,1.4,.5,1); }
.tilt-txt { display: flex; justify-content: space-between; font-size: 11px; font-weight: 800; margin-top: 2px; }
.tilt-txt b { font-size: 12px; }
.tilt.warn .tilt-txt b { color: var(--red); }
.scene { position: relative; z-index: 4; flex: 1; min-height: 0; display: flex; align-items: flex-end; justify-content: center; padding: 0 6px; }
.scene svg { width: 100%; height: 100%; }
.hit { cursor: pointer; }
.tray { position: relative; z-index: 6; }
.pier { position: relative; height: 92px; margin: 0 -10px; padding: 0 10px;
  background: repeating-linear-gradient(90deg, transparent 0 46px, rgba(70,40,15,.35) 46px 48px), linear-gradient(180deg, #b98552, #a06d3e);
  border-top: 6px solid #e8b783; box-shadow: inset 0 -10px 0 #8f5a2c, 0 -4px 10px rgba(0,0,0,.2); }
.pier::before { content: ""; position: absolute; left: 0; right: 0; top: 8px; height: 6px; background: repeating-linear-gradient(90deg, #ffd21f 0 22px, #2b2b2b 22px 44px); opacity: .9; }
.dock { position: absolute; top: 22px; left: 10px; right: 10px; bottom: 14px; display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; }
.dock .lbl { position: absolute; top: -6px; right: 4px; font-size: 11px; font-weight: 900; background: rgba(0,0,0,.3); border-radius: 8px; padding: 0 8px; }
.dock .empty { font-weight: 800; font-size: 14px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
.dct { transition: transform .15s; }
.dct.sel { transform: translateY(-10px) scale(1.12); filter: drop-shadow(0 8px 6px rgba(0,0,0,.35)); }
.dock.drop { outline: 3px dashed #fff; outline-offset: -2px; border-radius: 14px; }
.bar { display: flex; align-items: flex-end; gap: 8px; padding: 12px 12px max(26px, calc(env(safe-area-inset-bottom, 0px) + 18px)); background: linear-gradient(180deg, #164a95, #0e3470); }
.bst { position: relative; width: 58px; height: 58px; border-radius: 18px; display: grid; place-items: center; color: #1f5fb8; flex-shrink: 0;
  background: linear-gradient(180deg, #fff, #dbeeff); border: 3px solid #7fb3e8; box-shadow: inset 0 3px 0 #fff, 0 5px 0 #4f86c4; }
.bst:active { transform: translateY(3px); }
.bst .n { position: absolute; top: -8px; right: -8px; min-width: 24px; height: 24px; border-radius: 12px; background: linear-gradient(180deg, #ff7a6b, #ff3b2f); border: 2.5px solid #fff; color: #fff; font-weight: 900; font-size: 12px; display: grid; place-items: center; }
.bst b { position: absolute; bottom: -17px; left: -10px; right: -10px; text-align: center; font-size: 10.5px; font-weight: 900; color: #fff; }
.bst.off { opacity: .45; }
.bar .big { height: 58px; font-size: 24px; }
/* toast & modal */
.toast { position: absolute; z-index: 30; left: 16px; right: 16px; top: 120px; padding: 10px 14px; border-radius: 16px; background: #fff; color: var(--ink); font-weight: 800; font-size: 14px;
  box-shadow: 0 10px 30px rgba(0,0,0,.25); border-right: 6px solid var(--red); transition: opacity .25s, transform .25s; }
.toast.ok { border-right-color: var(--green); }
.toast[hidden] { display: none !important; }
.modal-wrap { position: absolute; inset: 0; z-index: 40; background: rgba(5,20,45,.6); display: flex; align-items: center; justify-content: center; padding: 70px 18px 20px; }
.modal-wrap[hidden] { display: none; }
.panel { position: relative; width: 100%; max-width: 380px; border-radius: 28px; padding: 64px 18px 20px; text-align: center; color: var(--ink);
  background: linear-gradient(180deg, var(--paper), var(--paper2)); border: 4px solid #e2a443; box-shadow: inset 0 4px 0 #fff, 0 8px 0 #a8701e, 0 30px 60px rgba(0,0,0,.4); animation: pop .35s cubic-bezier(.2,1.5,.4,1); }
@keyframes pop { from { transform: scale(.7); opacity: 0; } }
.ribbon { position: absolute; top: -28px; left: -14px; right: -14px; height: 62px; border-radius: 16px; display: grid; place-items: center;
  font-family: var(--font-display); font-size: 34px; color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.25); }
.rb-green { background: linear-gradient(180deg, #8dff8a, #1aa83a); border: 3px solid #0b7a2a; box-shadow: inset 0 4px 0 rgba(255,255,255,.4), 0 5px 0 #0a5f20; }
.rb-red { background: linear-gradient(180deg, #ff8a5c, #ff4b2e); border: 3px solid #b02a12; box-shadow: inset 0 4px 0 rgba(255,255,255,.4), 0 5px 0 #8a1f0c; }
.rb-blue { background: linear-gradient(180deg, #7cc8ff, #1f6fe0); border: 3px solid #0e4fa3; box-shadow: inset 0 4px 0 rgba(255,255,255,.4), 0 5px 0 #0b3f82; }
.panel h3 { margin: 0; font-size: 20px; font-weight: 900; }
.panel p { margin: 6px 0 0; font-weight: 700; color: #7a4a10; font-size: 15px; line-height: 1.6; text-wrap: balance; }
.panel .big { margin-top: 12px; height: 58px; font-size: 26px; }
.stars { position: absolute; top: -120px; left: 0; right: 0; display: flex; justify-content: center; align-items: flex-end; }
.stars svg { filter: drop-shadow(0 5px 0 #a35c00); }
.stars .off { filter: grayscale(1) opacity(.45); }
.rew { display: flex; gap: 10px; justify-content: center; margin: 12px 0 4px; }
.rw { min-width: 86px; border-radius: 16px; padding: 6px 10px; background: #fff; border: 3px solid #f0cf8f; box-shadow: 0 3px 0 #d9a85a; font-weight: 900; font-size: 20px; }
.demo { display: flex; justify-content: center; gap: 12px; align-items: center; margin: -4px 0 8px; }
.howto { text-align: right; margin: 8px 0 0; padding: 0 6px; display: grid; gap: 8px; font-weight: 700; font-size: 14.5px; color: #5a3608; }
.howto div { display: flex; gap: 8px; align-items: flex-start; }
.howto em { font-style: normal; flex-shrink: 0; width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; background: #1f6fe0; color: #fff; font-size: 13px; font-weight: 900; }
.link { margin-top: 12px; font-weight: 800; color: #8a5a1a; text-decoration: underline; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div id="app">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="defs"></defs></svg>
  <div class="cloud" style="top:12%;left:-20px;width:120px;height:32px"></div>
  <div class="cloud" style="top:10%;left:50px;width:70px;height:38px"></div>
  <div class="cloud" style="top:20%;right:-30px;width:140px;height:34px"></div>
  <div class="sea"></div>

  <!-- HOME -->
  <section class="view" id="v-home">
    <div class="home-top">
      <div class="res"><span id="h-coins" class="ltr">0</span> عملة</div>
      <div class="res">★ <span id="h-stars">0</span></div>
    </div>
    <div class="brand"><h1>لغز شحن السفينة</h1><p>حمّل · وازن · أبحر</p><span class="badge-test">نسخة تجريبية للاختبار فقط</span></div>
    <div class="home-ship" id="home-ship"></div>
    <div class="home-actions">
      <button class="big" id="btn-play">العب <small id="h-next">المرحلة 1</small></button>
      <button class="big blue" id="btn-levels">المراحل</button>
    </div>
  </section>

  <!-- LEVELS -->
  <section class="view" id="v-levels" hidden>
    <div class="lv-head"><button class="round" id="lv-back" aria-label="رجوع"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg></button><h2>المراحل</h2></div>
    <div class="lv-grid" id="lv-grid"></div>
  </section>

  <!-- GAME -->
  <section class="view" id="v-game" hidden>
    <div class="hud">
      <div class="lvname"><button class="round" id="g-back" aria-label="القائمة"><svg width="22" height="22" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1.5" fill="currentColor"/><rect x="14" y="4" width="4" height="16" rx="1.5" fill="currentColor"/></svg></button></div>
      <div class="moves"><small>الحركات</small><b id="g-moves" class="ltr">0</b><i id="g-par">الهدف ≤ 4</i></div>
      <div class="goalbox"><small id="g-lvl">المرحلة 1</small><div class="ports" id="g-ports"></div></div>
    </div>
    <div class="tilt" id="g-tilt"><div class="tube"><i class="m" style="left:calc(50% - 18px)"></i><i class="m" style="left:calc(50% + 16px)"></i><i class="b" id="g-bub" style="left:50%"></i></div>
      <div class="tilt-txt"><span>يسار</span><b id="g-tilt-t">متوازنة</b><span>يمين</span></div></div>
    <div class="scene" id="g-scene"></div>
    <div class="tray">
      <div class="pier"><div class="dock" id="g-dock"></div></div>
      <div class="bar">
        <button class="bst" id="b-undo"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span class="n" id="n-undo">5</span><b>تراجع</b></button>
        <button class="bst" id="b-weight"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="3"/><line x1="12" y1="22" x2="12" y2="8"/><path d="M5 12H2a10 10 0 0 0 20 0h-3"/></svg><span class="n" id="n-weight">1</span><b>ثقل موازن</b></button>
        <button class="bst" id="b-preview"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg><span class="n" id="n-preview">3</span><b>معاينة</b></button>
        <button class="big" id="b-sail">أبحر</button>
      </div>
    </div>
  </section>

  <div class="toast" id="toast" hidden></div>
  <div class="modal-wrap" id="modal" hidden><div class="panel" id="panel"></div></div>
</div>

<script>
(function () {
  const PORT = {
    1: { c: '#ea4e40', l: '#f79586', d: '#a82c21', s: '●', name: 'الأحمر' },
    2: { c: '#317ad6', l: '#86b9f0', d: '#1b4f96', s: '▲', name: 'الأزرق' },
    3: { c: '#f2b11f', l: '#fbd985', d: '#b07608', s: '■', name: 'الأصفر' },
    4: { c: '#31a865', l: '#8ad8aa', d: '#1c7142', s: '◆', name: 'الأخضر' }
  };
  // shared gradients
  let defs = '';
  for (const k in PORT) { const p = PORT[k];
    defs += `<linearGradient id="ct${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${p.l}"/><stop offset=".35" stop-color="${p.c}"/><stop offset="1" stop-color="${p.d}"/></linearGradient>`; }
  defs += `<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2fbff"/><stop offset="1" stop-color="#9fd6f2"/></linearGradient>
  <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34506f"/><stop offset=".5" stop-color="#22384f"/><stop offset="1" stop-color="#142336"/></linearGradient>
  <linearGradient id="hullRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c4463a"/><stop offset="1" stop-color="#7f2219"/></linearGradient>
  <linearGradient id="bridge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#d7e1ec"/></linearGradient>

    G.sel = null; const r = check();
    if (r.why.length) { G.errs = r.errs; render(); fail(r); return; }
    G.busy = true; G.hidden = new Set(); render();
    const order = G.L.ports.slice(); let k = 0;
    (function nextPort() {
      if (k >= order.length) { G.busy = false; G.hidden = null; win(); return; }
      const p = order[k++]; toast(`وصلت إلى الميناء ${k}: تفريغ حاويات ${PORT[p].name}`, true);
      G.cols.forEach((st) => st.forEach((it) => { if (it.p === p) G.hidden.add(it); }));
      setTimeout(() => { render(); setTimeout(nextPort, 650); }, 450);
    })();
  }
  // ---------- modals ----------
  function modal(html) { $('toast').hidden = true; $('panel').innerHTML = html; $('modal').hidden = false; }
  const closeModal = () => { $('modal').hidden = true; };
  function win() {
    const par = G.L.dock.length, st = G.moves <= par ? 3 : G.moves <= par + 3 ? 2 : 1;
    const coins = 10 + st * 5; save.coins += coins; save.stars[G.i] = Math.max(save.stars[G.i] || 0, st); persist();
    const last = G.i === LEVELS.length - 1;
    modal(`<div class="stars">${starSVG(84, st >= 1)}<span style="margin-bottom:18px">${starSVG(108, st >= 2)}</span>${starSVG(84, st >= 3)}</div>
      <div class="ribbon rb-green">رحلة موفقة!</div><h3>المرحلة ${G.i + 1} مكتملة</h3><p>${G.moves} حركة ${st === 3 ? '· الحل الأمثل' : `· الهدف ${par} للنجوم الثلاث`}</p>
      <div class="rew"><div class="rw">+${coins} عملة</div><div class="rw">+${st} ★</div></div>
      <button class="big purple" data-act="double">ضاعف العملات <span class="tag">إعلان تجريبي</span></button>
      <button class="big" data-act="${last ? 'home' : 'next'}">${last ? 'الرئيسية' : 'التالي'}</button>
      <button class="link" data-act="retry">أعد المرحلة</button>`);
    G.lastCoins = coins;
  }
  function fail(r) {
    const tilt = r.why[0] === 'tilt';
    modal(`<div class="ribbon rb-red">${tilt ? 'السفينة مالت!' : 'الشحنة غير صحيحة'}</div><h3>لا يمكن الإبحار الآن</h3>
      <p>${r.why.map((w) => WHY[w](r.t)).join('<br>')}</p>
      <button class="big orange" data-act="fix">عدّل الشحنة</button>
      <button class="big purple" data-act="hint">تلميح <span class="tag">إعلان تجريبي</span></button>
      <button class="link" data-act="retry">ابدأ المرحلة من جديد</button>`);
  }
  function intro(it, weights) {
    modal(`<div class="ribbon rb-blue">عنصر جديد!</div><div class="demo">${it.demo.map(([p, w, k]) => miniCt({ p, w, k }, weights)).join('')}</div>
      <h3>${it.title}</h3><p>${it.text}</p><button class="big" data-act="close">فهمت</button>`);
  }
  function howTo() {
    modal(`<div class="ribbon rb-blue">كيف تلعب</div>
      <div class="howto"><div><em>1</em><span>اضغط حاوية على الرصيف، ثم اضغط العمود الذي تريد وضعها فيه.</span></div>
      <div><em>2</em><span>راقب ميزان الفقاعة في الأعلى: أبقِ الفقاعة في المنطقة الخضراء.</span></div>
      <div><em>3</em><span>السفينة تمر بالموانئ بالترتيب المرقّم. حاويات الميناء الأول يجب أن تكون في الأعلى.</span></div>
      <div><em>4</em><span>تستطيع نقل الحاوية العليا من أي عمود إلى عمود آخر، أو إرجاعها للرصيف.</span></div>
      <div><em>5</em><span>حين تُحمّل كل الحاويات اضغط «أبحر».</span></div></div>
      <button class="big" data-act="close">ابدأ</button>`);
  }
  let toastT; function toast(msg, ok) { const t = $('toast'); t.textContent = msg; t.classList.toggle('ok', !!ok); t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3200); }

  // ---------- events ----------
  $('btn-play').onclick = () => { let n = LEVELS.findIndex((_, i) => !save.stars[i]); if (n < 0) n = 0; startLevel(n); };
  $('btn-levels').onclick = renderLevels;
  $('lv-back').onclick = renderHome;
  $('g-back').onclick = () => { closeModal(); renderLevels(); };
  $('lv-grid').onclick = (e) => { const b = e.target.closest('[data-lv]'); if (!b) return; const i = +b.dataset.lv; if (!unlocked(i)) { toast('أكمل المرحلة السابقة أولاً'); return; } startLevel(i); };
  $('g-scene').onclick = (e) => { const h = e.target.closest('[data-col]'); if (h) tapCol(+h.dataset.col); };
  $('g-dock').onclick = (e) => { const b = e.target.closest('[data-dk]'); if (b) pickDock(+b.dataset.dk); else returnToDock(); };
  $('b-undo').onclick = undo; $('b-preview').onclick = preview; $('b-weight').onclick = counterweight; $('b-sail').onclick = sail;
  $('panel').onclick = (e) => { const a = e.target.closest('[data-act]'); if (!a) return; const act = a.dataset.act;
    if (act === 'close' || act === 'fix') { closeModal(); render(); }
    else if (act === 'next') { closeModal(); startLevel(G.i + 1); }
    else if (act === 'retry') { closeModal(); startLevel(G.i); }
    else if (act === 'home') { closeModal(); renderHome(); }
    else if (act === 'double') { save.coins += G.lastCoins; persist(); a.disabled = true; a.textContent = 'تمت المضاعفة'; toast('في النسخة الحقيقية يُعرض هنا إعلان قصير اختياري', true); }
    else if (act === 'hint') { closeModal(); render(); toast('تلميح: ضع حاويات الميناء الأخير في الأسفل، والثقيلة في الأعمدة القريبة من المنتصف، ووزّع الباقي على الجهتين بالتساوي.', true); } };
  renderHome();
})();
</script>
