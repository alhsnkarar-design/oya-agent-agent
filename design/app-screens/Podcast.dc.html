      <div aria-hidden="true" style="display: flex; align-items: center; gap: 2px; height: 34px; margin: 10px 0 4px">

        <button aria-label="تنزيل" style="width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; color: #D6D4E6; display: flex; align-items: center; justify-content: center; padding: 0"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg></button>

      <button aria-label="المساعد الصوتي" style="width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; color: #5CD3F5; display: flex; align-items: center; justify-content: center; padding: 0"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"></path></svg></button>
