<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الدبلجة — اختيار الصوت والنبرة</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=Readex+Pro:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#06060B}
svg.i{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
button{font:inherit;color:inherit;cursor:pointer;margin:0}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.sheet{animation:up .45s cubic-bezier(.2,.8,.2,1) both}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0A12; color: #F3F2FA; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif">

  <div aria-hidden="true" style="position: absolute; inset: 0; padding: 76px 16px 0">
    <div style="height: 200px; border-radius: 20px; background: #16263A"></div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(4,4,8,0.72)"></div>

  <section class="sheet" role="dialog" aria-label="اختيار الصوت والنبرة" style="position: absolute; right: 0; left: 0; bottom: 0; height: 724px; box-sizing: border-box; border-radius: 30px 30px 0 0; background: #11111A; border-top: 1px solid #2A2A3D; display: flex; flex-direction: column">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; margin-top: 10px; border-radius: 2px; background: #3A3A52"></span>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 0">
      <h2 style="margin: 0; font-family: 'Readex Pro', sans-serif; font-size: 19px; font-weight: 600">الصوت والنبرة</h2>
      <button aria-label="إغلاق" style="width: 40px; height: 40px; border-radius: 50%; border: 1px solid #2A2A3D; background: #1A1A27; color: #D6D4E6; display: flex; align-items: center; justify-content: center; padding: 0"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>

    <div style="flex: 1; min-height: 0; overflow: hidden; padding: 14px 16px 0; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <span style="font-size: 14px; font-weight: 600">الصوت <span style="font-size: 12px; font-weight: 400; color: #8A88A3">· 20 صوتًا مدعومًا</span></span>
        <div role="tablist" aria-label="تصفية الأصوات" style="display: flex; gap: 2px; padding: 3px; border-radius: 11px; background: #0A0A12; border: 1px solid #222232">
          <button role="tab" aria-selected="true" style="height: 28px; padding: 0 10px; border: 0; border-radius: 8px; background: #1F1F2E; color: #F3F2FA; font-size: 12px; font-weight: 600">الكل</button>
          <button role="tab" aria-selected="false" style="height: 28px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: #B4B2C9; font-size: 12px">أنثوي</button>
          <button role="tab" aria-selected="false" style="height: 28px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: #B4B2C9; font-size: 12px">ذكوري</button>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{voices}}" as="v" hint-placeholder-count="20">
          <button aria-pressed="{{v.pressed}}" style="{{v.tile}}">
            <span style="{{v.dot}}"><svg class="i" width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4M8 6.5v11M12 3.5v17M16 6.5v11M20 10v4"></path></svg></span>
            <span style="display: flex; flex-direction: column; align-items: flex-start; line-height: 1.25"><span style="font-size: 12px; font-weight: 600">{{v.num}}</span><span style="font-size: 10.5px; color: #8A88A3">{{v.desc}}</span></span>
          </button>
        </sc-for>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 4px">
        <span style="font-size: 14px; font-weight: 600">النبرة <span style="font-size: 12px; font-weight: 400; color: #8A88A3">· 15 نبرة مدعومة</span></span>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 6px">
        <sc-for list="{{tones}}" as="t" hint-placeholder-count="15">
          <button aria-pressed="{{t.pressed}}" style="{{t.style}}">{{t.label}}</button>
        </sc-for>
      </div>
    </div>

    <footer style="padding: 12px 16px 24px; border-top: 1px solid #1F1F2E; display: flex; align-items: center; gap: 10px">
      <button aria-label="معاينة الصوت المختار" style="width: 52px; height: 52px; border-radius: 16px; border: 1px solid #2A2A3D; background: #1A1A27; color: #5CD3F5; display: flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"></path></svg></button>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
        <span style="font-size: 13.5px; font-weight: 600">صوت 07 · نبرة هادئة</span>
        <span style="font-size: 11.5px; color: #8A88A3">معاينة بالإسبانية</span>
      </div>
      <a href="Dubbing.dc.html" style="height: 52px; padding: 0 22px; box-sizing: border-box; border-radius: 16px; background: #5CD3F5; color: #06141B; font-size: 15px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center">تأكيد</a>
    </footer>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const descs = ['دافئ','عميق','هادئ','مشرق','رخيم','شاب','ناعم','ناضج','واضح','رزين','حيوي','خافت','قوي','رقيق','إذاعي','ودود','جاد','مرح','حكيم','صافٍ'];
    const selectedVoice = 6;
    const voices = descs.map((d, i) => {
      const on = i === selectedVoice;
      return {
        num: String(i + 1).padStart(2, '0'),
        desc: d,
        pressed: on ? 'true' : 'false',
        tile: 'height:52px;border-radius:14px;padding:0 8px;display:flex;align-items:center;gap:6px;text-align:right;' + (on ? 'border:1.5px solid #5CD3F5;background:rgba(92,211,245,0.08)' : 'border:1px solid #222232;background:#161622'),
        dot: 'width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;' + (on ? 'background:#5CD3F5;color:#06141B' : (i % 2 ? 'background:#2A2457;color:#B9AFFF' : 'background:#10313D;color:#7FDDF7'))
      };
    });
    const toneNames = ['هادئة','ودّية','رسمية','حماسية','قصصية','تعليمية','درامية','مرحة','واثقة','حزينة','إخبارية','تحفيزية','دافئة','جادة','ساخرة'];
    const tones = toneNames.map((t, i) => {
      const on = i === 0;
      return {
        label: t,
        pressed: on ? 'true' : 'false',
        style: 'height:36px;padding:0 14px;border-radius:999px;font-size:13px;' + (on ? 'border:1.5px solid #5CD3F5;background:rgba(92,211,245,0.1);color:#9BE6FA;font-weight:600' : 'border:1px solid #262636;background:#161622;color:#D6D4E6')
      };
    });
    return { voices, tones };
  }
}
</script>
</body>
</html>
