<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الرئيسية — وضع Chat</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=Readex+Pro:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#06060B}
svg.i{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
button{font:inherit;color:inherit;cursor:pointer;margin:0}
textarea::placeholder{color:#8A88A3}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0A12; color: #F3F2FA; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; display: flex; flex-direction: column; padding: 12px 20px 28px">

  <header style="display: flex; align-items: center; justify-content: space-between; height: 52px">
    <button aria-label="القائمة" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid #262636; background: #12121C; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M10 17h10"></path></svg>
    </button>
    <div style="display: flex; align-items: center; gap: 8px">
      <svg aria-hidden="true" width="30" height="30" viewBox="0 0 32 32"><circle cx="16" cy="16" r="5.5" fill="#9B8CFF"></circle><ellipse cx="16" cy="16" rx="13.5" ry="6" fill="none" stroke="#5CD3F5" stroke-width="1.8" transform="rotate(-28 16 16)"></ellipse><circle cx="27.9" cy="9.7" r="2.1" fill="#5CD3F5"></circle></svg>
      <span style="font-family: 'Readex Pro', sans-serif; font-weight: 600; font-size: 21px">مدار</span>
    </div>
    <button aria-label="سجل المهام" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid #262636; background: #12121C; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.4-5.7"></path><path d="M20 4v4h-4"></path><path d="M12 8v4l-3 2"></path></svg>
    </button>
  </header>

  <section style="margin-top: 28px; display: flex; flex-direction: column; gap: 8px">
    <span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; background: rgba(92,211,245,0.12); color: #7FDDF7; font-size: 12px; font-weight: 600">
      <span style="width: 6px; height: 6px; border-radius: 50%; background: #5CD3F5"></span>
      مهمة واحدة في كل مرة
    </span>
    <h1 style="margin: 0; font-family: 'Readex Pro', sans-serif; font-weight: 600; font-size: 28px; line-height: 1.3">اختر أداة، واكتب التفاصيل</h1>
  </section>

  <section aria-label="منطقة المحادثة" style="margin-top: 20px; border-radius: 26px; background: #12121C; border: 1px solid #1F4A5A; padding: 8px 8px 10px; box-shadow: 0 0 0 4px rgba(92,211,245,0.07)">
    <div role="tablist" aria-label="وضع المحادثة" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 18px; background: #0A0A12; border: 1px solid #222232">
      <button role="tab" aria-selected="false" style="height: 40px; border: 0; border-radius: 14px; background: transparent; color: #B4B2C9; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 500">
        <svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><ellipse cx="12" cy="12" rx="10" ry="4.5" transform="rotate(-30 12 12)"></ellipse></svg>
        <span dir="ltr">AI Agent</span>
      </button>
      <button role="tab" aria-selected="true" style="height: 40px; border: 0; border-radius: 14px; background: #5CD3F5; color: #06141B; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 600">
        <svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l1-4A8 8 0 1 1 20 12z"></path></svg>
        <span dir="ltr">Chat</span>
      </button>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; margin: 10px 6px 0">
      <span style="display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 6px 0 10px; border-radius: 10px; background: rgba(92,211,245,0.12); border: 1px solid rgba(92,211,245,0.35); color: #9BE6FA; font-size: 13px; font-weight: 600">
        <svg class="i" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15v-3a8 8 0 0 1 16 0v3"></path><rect x="3" y="14" width="4.5" height="6.5" rx="1.6"></rect><rect x="16.5" y="14" width="4.5" height="6.5" rx="1.6"></rect></svg>
        صوت وبودكاست
        <button aria-label="إزالة المهمة المختارة" style="width: 24px; height: 24px; border: 0; border-radius: 6px; background: transparent; color: #9BE6FA; display: flex; align-items: center; justify-content: center; padding: 0">
          <svg class="i" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </span>
    </div>

    <textarea aria-label="تفاصيل المهمة" placeholder="اكتب تفاصيل المهمة… مثل: حوّل هذا الكتاب إلى حلقة بودكاست بصوتين." style="display: block; box-sizing: border-box; width: 100%; height: 76px; margin-top: 2px; padding: 10px; border: 0; outline: none; resize: none; background: transparent; color: #F3F2FA; font-family: inherit; font-size: 16px; line-height: 1.6"></textarea>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 2px">
      <button style="height: 44px; padding: 0 14px 0 16px; border-radius: 999px; border: 1px solid #2A2A3D; background: #1A1A27; display: flex; align-items: center; gap: 8px; color: #D6D4E6; font-size: 13.5px; font-weight: 500">
        <svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5"></path></svg>
        رفع ملف أو كتاب
      </button>
      <div style="display: flex; align-items: center; gap: 8px">
        <button aria-label="المساعد الصوتي المباشر" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #2A2A3D; background: #1A1A27; display: flex; align-items: center; justify-content: center; padding: 0; color: #5CD3F5">
          <svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"></path></svg>
        </button>
        <button aria-label="إرسال" style="width: 48px; height: 48px; border-radius: 50%; border: 0; background: #5CD3F5; color: #06141B; display: flex; align-items: center; justify-content: center; padding: 0">
          <svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2"><path d="M12 19V5M6 11l6-6 6 6"></path></svg>
        </button>
      </div>
    </div>
  </section>

  <section aria-label="الأدوات" style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px">
      <h2 style="margin: 0; font-size: 15px; font-weight: 600">اختر المهمة</h2>
      <span style="color: #8A88A3; font-size: 12px">أداة واحدة لكل محادثة</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button aria-pressed="true" style="height: 64px; border-radius: 18px; border: 1.5px solid #5CD3F5; background: rgba(92,211,245,0.08); padding: 0 12px; display: flex; align-items: center; gap: 10px; text-align: right">
        <span style="width: 38px; height: 38px; border-radius: 12px; background: #5CD3F5; color: #06141B; display: flex; align-items: center; justify-content: center">
          <svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15v-3a8 8 0 0 1 16 0v3"></path><rect x="3" y="14" width="4.5" height="6.5" rx="1.6"></rect><rect x="16.5" y="14" width="4.5" height="6.5" rx="1.6"></rect></svg>
        </span>
        <span style="flex: 1; font-size: 13.5px; font-weight: 600; line-height: 1.35">صوت وبودكاست</span>
        <svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="color: #5CD3F5; stroke-width: 2.2"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
      </button>
      <button aria-pressed="false" style="height: 64px; border-radius: 18px; border: 1px solid #222232; background: #12121C; padding: 0 12px; display: flex; align-items: center; gap: 10px; text-align: right">
        <span style="width: 38px; height: 38px; border-radius: 12px; background: #1A1A27; color: #D6D4E6; display: flex; align-items: center; justify-content: center">
          <svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 3.5l1.9 5 5 1.9-5 1.9-1.9 5-1.9-5-5-1.9 5-1.9z"></path><path d="M18.5 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"></path></svg>
        </span>
        <span style="flex: 1; font-size: 13.5px; font-weight: 600; line-height: 1.35">موشن جرافيكس</span>
      </button>
      <button aria-pressed="false" style="height: 64px; border-radius: 18px; border: 1px solid #222232; background: #12121C; padding: 0 12px; display: flex; align-items: center; gap: 10px; text-align: right">
        <span style="width: 38px; height: 38px; border-radius: 12px; background: #1A1A27; color: #D6D4E6; display: flex; align-items: center; justify-content: center">
          <svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="11" height="4" rx="1.5"></rect><rect x="9" y="10" width="12" height="4" rx="1.5"></rect><rect x="5" y="16" width="9" height="4" rx="1.5"></rect></svg>
        </span>
        <span style="flex: 1; font-size: 13.5px; font-weight: 600; line-height: 1.35">مونتاج تلقائي</span>
      </button>
      <button aria-pressed="false" style="height: 64px; border-radius: 18px; border: 1px solid #222232; background: #12121C; padding: 0 12px; display: flex; align-items: center; gap: 10px; text-align: right">
        <span style="width: 38px; height: 38px; border-radius: 12px; background: #1A1A27; color: #D6D4E6; display: flex; align-items: center; justify-content: center">
          <svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="14" height="11" rx="2.2"></rect><path d="M8.5 8l3.5 2-3.5 2z"></path><path d="M14 20.5l6.2-6.2-2-2L12 18.5l-.5 2.5z"></path></svg>
        </span>
        <span style="flex: 1; font-size: 13.5px; font-weight: 600; line-height: 1.35">تعديل الفيديو</span>
      </button>
      <button aria-pressed="false" style="height: 64px; border-radius: 18px; border: 1px solid #222232; background: #12121C; padding: 0 12px; display: flex; align-items: center; gap: 10px; text-align: right">
        <span style="width: 38px; height: 38px; border-radius: 12px; background: #1A1A27; color: #D6D4E6; display: flex; align-items: center; justify-content: center">
          <svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 5.5h8M7.5 3.5v2M5 5.5c.6 3 2.8 5.6 6 7M10 5.5c-.6 3-2.8 5.6-6 7"></path><path d="M12.5 20.5l4-9 4 9M14 17.3h5"></path></svg>
        </span>
        <span style="flex: 1; font-size: 13.5px; font-weight: 600; line-height: 1.35">دبلجة الفيديو</span>
      </button>
      <button aria-pressed="false" style="height: 64px; border-radius: 18px; border: 1px solid #222232; background: #12121C; padding: 0 12px; display: flex; align-items: center; gap: 10px; text-align: right">
        <span style="width: 38px; height: 38px; border-radius: 12px; background: #1A1A27; color: #D6D4E6; display: flex; align-items: center; justify-content: center">
          <svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4M8 6.5v11M12 3.5v17M16 6.5v11M20 10v4"></path></svg>
        </span>
        <span style="flex: 1; font-size: 13.5px; font-weight: 600; line-height: 1.35">المساعد الصوتي</span>
      </button>
    </div>
    <p style="margin: 2px 4px 0; color: #8A88A3; font-size: 12.5px; line-height: 1.6">تُضاف الأداة المختارة إلى المحادثة، ويُكمل الوكيل تنفيذها وفق طلبك فقط.</p>
  </section>
</div>
</x-dc>
