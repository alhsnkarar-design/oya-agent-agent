<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>معرض أعمالي</title>
<meta name="description" content="منتجات مادية ورقمية، خدمات فريلانس، وإدارة سوشيال ميديا">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4f8;--card:#fff;--ink:#14162b;--muted:#5d6280;--brand:#1739b8;--brand2:#22c3a6;--line:#e3e5ef}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1120;--card:#181b2e;--ink:#eef0fa;--muted:#a3a8c3;--line:#2a2e48}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,sans-serif;line-height:1.7}
.wrap{max-width:1100px;margin:auto;padding:0 16px}
header{padding:56px 0 32px;text-align:center}
.avatar{width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;color:#fff;font-size:40px;font-weight:800;margin:0 auto 16px;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
h1{margin:0;font-size:clamp(28px,5vw,42px)}
.tag{color:var(--muted);font-size:18px;margin:8px 0 20px}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{background:var(--brand);color:#fff;padding:10px 22px;border-radius:12px;text-decoration:none;font-weight:600}
.btn.alt{background:transparent;color:var(--brand);border:2px solid var(--brand)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:28px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center}
.stat b{display:block;font-size:26px;color:var(--brand)}
.filters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:24px 0}
.filters button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 18px;border-radius:999px;cursor:pointer}
.filters button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.thumb{aspect-ratio:4/3;background:linear-gradient(135deg,#dfe6ff,#d5f6ee);display:grid;place-items:center;font-size:48px}
.thumb img{width:100%;height:100%;object-fit:cover}
.body{padding:14px 16px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.kind{font-size:13px;color:var(--brand2);font-weight:600}
.card h3{margin:0;font-size:18px}
.card p{margin:0;color:var(--muted);font-size:15px;flex:1}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.price{font-weight:800}
.card a{color:var(--brand);font-weight:600;text-decoration:none}
section h2{text-align:center;margin:48px 0 8px}
.social{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:16px 0}
.social a{background:var(--card);border:1px solid var(--line);padding:10px 18px;border-radius:12px;color:var(--ink);text-decoration:none}
footer{text-align:center;color:var(--muted);padding:40px 0;font-size:14px}
</style>
</head>
<body>
<!--
  ✏️ لتعديل المحتوى: غيّر البيانات داخل كائن PROFILE ومصفوفة WORKS في أسفل الصفحة فقط.
  الصور: ضع رابط الصورة في الحقل image (أو اتركه فارغًا لعرض أيقونة).
-->
<div class="wrap">
  <header>
    <div class="avatar" id="avatar"></div>
    <h1 id="name"></h1>
    <p class="tag" id="tagline"></p>
    <div class="btns"><a class="btn" href="#works">تصفّح أعمالي</a><a class="btn alt" id="contactBtn" href="#contact">تواصل معي</a></div>
  </header>

  <div class="stats" id="stats"></div>

  <section id="works">
    <h2>أعمالي ومنتجاتي</h2>
    <div class="filters" id="filters"></div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="contact">
    <h2>تابعني وتواصل معي</h2>
    <div class="social" id="social"></div>
  </section>
  <footer id="foot"></footer>
</div>

<script>
/* ================== بياناتك — عدّلها هنا ================== */
const PROFILE = {
  name: "اسمك أو اسم علامتك التجارية",
  tagline: "أبيع منتجات مادية ورقمية • فريلانسر • صانع محتوى وإدارة سوشيال ميديا",
  avatar: "",            // رابط صورتك أو شعارك
  whatsapp: "",          // مثال: 201000000000
  links: [               // روابط حساباتك
    { label: "فيسبوك", url: "#" },
    { label: "إنستجرام", url: "#" },
    { label: "تيك توك", url: "#" },
    { label: "بينترست", url: "#" },
    { label: "فايفر / مستقل / أب وورك", url: "#" },
    { label: "البريد الإلكتروني", url: "mailto:you@example.com" }
  ]
};

// type: physical | digital | freelance | social
const WORKS = [
  { type:"physical",  title:"منتج مادي — مثال", desc:"وصف مختصر للمنتج ومميزاته وطريقة الشحن.", price:"٢٥٠ ج.م", image:"", link:"#" },
  { type:"physical",  title:"منتج مادي — مثال ٢", desc:"خامات عالية الجودة وتوصيل لكل المحافظات.", price:"١٨٠ ج.م", image:"", link:"#" },
  { type:"digital",   title:"منتج رقمي — كتاب إلكتروني / قالب", desc:"تحميل فوري بعد الدفع، ملف PDF أو قالب جاهز.", price:"$9", image:"", link:"#" },
  { type:"digital",   title:"منتج رقمي — كورس / حزمة تصاميم", desc:"محتوى رقمي جاهز للاستخدام مباشرة.", price:"$19", image:"", link:"#" },
  { type:"freelance", title:"خدمة فريلانس — مثال", desc:"وصف الخدمة التي تقدمها للعملاء ومدة التسليم.", price:"يبدأ من $15", image:"", link:"#" },
  { type:"freelance", title:"مشروع منفّذ لعميل", desc:"نبذة عن مشروع سابق والنتيجة التي حققتها.", price:"", image:"", link:"#" },
  { type:"social",    title:"إدارة صفحة سوشيال ميديا", desc:"خطة محتوى، تصميم منشورات، وزيادة التفاعل.", price:"", image:"", link:"#" },
  { type:"social",    title:"فيديو / ريلز منتشر", desc:"مثال لمحتوى حقق مشاهدات وتفاعل عالي.", price:"", image:"", link:"#" }
];
/* ========================================================== */

const KINDS = { physical:["منتجات مادية","📦"], digital:["منتجات رقمية","💾"], freelance:["خدمات فريلانس","💼"], social:["سوشيال ميديا","📱"] };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

$("name").textContent = PROFILE.name;
$("tagline").textContent = PROFILE.tagline;
$("foot").textContent = "© " + new Date().getFullYear() + " " + PROFILE.name;
document.title = PROFILE.name;
$("avatar").innerHTML = PROFILE.avatar ? `<img src="${esc(PROFILE.avatar)}" alt="">` : esc(PROFILE.name.trim()[0] || "★");
if (PROFILE.whatsapp) $("contactBtn").href = "https://wa.me/" + PROFILE.whatsapp;

$("stats").innerHTML = Object.entries(KINDS).map(([k,[l,i]]) =>
  `<div class="stat"><b>${WORKS.filter(w=>w.type===k).length}</b>${i} ${l}</div>`).join("");

$("social").innerHTML = PROFILE.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("");

let current = "all";
function render(){
  $("filters").innerHTML = [["all","الكل"], ...Object.entries(KINDS).map(([k,[l]])=>[k,l])]
    .map(([k,l]) => `<button class="${k===current?"on":""}" data-k="${k}">${l}</button>`).join("");
  $("grid").innerHTML = WORKS.filter(w => current==="all" || w.type===current).map(w => `
    <article class="card">
      <div class="thumb">${w.image ? `<img src="${esc(w.image)}" alt="${esc(w.title)}" loading="lazy">` : KINDS[w.type][1]}</div>
      <div class="body">
        <span class="kind">${KINDS[w.type][0]}</span>
        <h3>${esc(w.title)}</h3>
        <p>${esc(w.desc)}</p>
        <div class="row"><span class="price">${esc(w.price)}</span>${w.link ? `<a href="${esc(w.link)}" target="_blank" rel="noopener">عرض ←</a>` : ""}</div>
      </div>
    </article>`).join("");
}
$("filters").addEventListener("click", e => { if (e.target.dataset.k){ current = e.target.dataset.k; render(); } });
render();
</script>
</body>
</html>
